services:
    api:
        build:
            context: ./api
            target: ${API_TARGET:-dev}
        env_file:
            - .env
            - api/.env
        environment:
            FILESYSTEM_DISK: s3
            AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-sendocs-local-access}
            AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-local-only-change-this-secret}
            AWS_DEFAULT_REGION: ${S3_REGION:-us-east-1}
            AWS_BUCKET: ${S3_BUCKET:-sendocs-private}
            AWS_ENDPOINT: http://rustfs:9000
            AWS_USE_PATH_STYLE_ENDPOINT: "true"
        ports:
            - "${API_BIND:-127.0.0.1}:${API_PORT:-8000}:8000"
        volumes:
            - ./api:/var/www/html
            - /var/www/html/vendor
        depends_on:
            db:
                condition: service_healthy
            object-storage-init:
                condition: service_completed_successfully
        restart: unless-stopped

    worker:
        build:
            context: ./api
            target: ${API_TARGET:-dev}
        command:
            - php
            - artisan
            - queue:work
            - --sleep=3
            - --tries=3
            - --max-time=3600
        env_file:
            - .env
            - api/.env
        environment:
            FILESYSTEM_DISK: s3
            AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-sendocs-local-access}
            AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-local-only-change-this-secret}
            AWS_DEFAULT_REGION: ${S3_REGION:-us-east-1}
            AWS_BUCKET: ${S3_BUCKET:-sendocs-private}
            AWS_ENDPOINT: http://rustfs:9000
            AWS_USE_PATH_STYLE_ENDPOINT: "true"
        volumes:
            - ./api:/var/www/html
            - /var/www/html/vendor
        depends_on:
            db:
                condition: service_healthy
            object-storage-init:
                condition: service_completed_successfully
        restart: unless-stopped

    scheduler:
        build:
            context: ./api
            target: ${API_TARGET:-dev}
        command:
            - php
            - artisan
            - schedule:work
        env_file:
            - .env
            - api/.env
        environment:
            FILESYSTEM_DISK: s3
            AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-sendocs-local-access}
            AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-local-only-change-this-secret}
            AWS_DEFAULT_REGION: ${S3_REGION:-us-east-1}
            AWS_BUCKET: ${S3_BUCKET:-sendocs-private}
            AWS_ENDPOINT: http://rustfs:9000
            AWS_USE_PATH_STYLE_ENDPOINT: "true"
        volumes:
            - ./api:/var/www/html
            - /var/www/html/vendor
        depends_on:
            db:
                condition: service_healthy
            object-storage-init:
                condition: service_completed_successfully
        restart: unless-stopped

    web:
        build:
            context: ./web
            target: ${WEB_TARGET:-dev}
        env_file:
            - .env
            - web/.env
        environment:
            VITE_API_PROXY: http://api:8000
        ports:
            - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-3000}:3000"
        volumes:
            - ./web:/app
            - /app/node_modules
        depends_on:
            api:
                condition: service_started
        restart: unless-stopped

    rustfs-volume-init:
        image: busybox:1.36
        command: ["sh", "-c", "chown -R 10001:10001 /data"]
        volumes:
            - rustfs-data:/data
        restart: "no"

    rustfs:
        image: rustfs/rustfs:1.0.1
        user: "10001:10001"
        environment:
            RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY_ID:-sendocs-local-access}
            RUSTFS_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:-local-only-change-this-secret}
            RUSTFS_ADDRESS: 0.0.0.0:9000
            RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
            RUSTFS_VOLUMES: /data
        ports:
            - "${RUSTFS_BIND:-127.0.0.1}:${RUSTFS_API_PORT:-9000}:9000"
            - "${RUSTFS_BIND:-127.0.0.1}:${RUSTFS_CONSOLE_PORT:-9001}:9001"
        volumes:
            - rustfs-data:/data
        depends_on:
            rustfs-volume-init:
                condition: service_completed_successfully
        restart: unless-stopped

    object-storage-init:
        image: amazon/aws-cli:2
        entrypoint: ["/bin/sh", "-c"]
        command:
            - |
                attempt=0
                until aws --endpoint-url "$AWS_ENDPOINT" s3api list-buckets >/dev/null 2>&1; do
                    attempt=$((attempt + 1))
                    if [ "$attempt" -ge 60 ]; then
                        echo "RustFS did not become ready" >&2
                        exit 1
                    fi
                    sleep 2
                done
                if ! aws --endpoint-url "$AWS_ENDPOINT" s3api head-bucket --bucket "$AWS_BUCKET" >/dev/null 2>&1; then
                    aws --endpoint-url "$AWS_ENDPOINT" s3api create-bucket --bucket "$AWS_BUCKET"
                fi
        environment:
            AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-sendocs-local-access}
            AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-local-only-change-this-secret}
            AWS_DEFAULT_REGION: ${S3_REGION:-us-east-1}
            AWS_EC2_METADATA_DISABLED: "true"
            AWS_ENDPOINT: http://rustfs:9000
            AWS_BUCKET: ${S3_BUCKET:-sendocs-private}
        depends_on:
            rustfs:
                condition: service_started
        restart: "no"

    db:
        image: postgres:17-alpine
        env_file:
            - .env
        ports:
            - "${POSTGRES_BIND:-127.0.0.1}:5432:5432"
        volumes:
            - db-data:/var/lib/postgresql/data
        healthcheck:
            test:
                - CMD-SHELL
                - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
            interval: 5s
            timeout: 5s
            retries: 12
        restart: unless-stopped

volumes:
    db-data:
    rustfs-data:
