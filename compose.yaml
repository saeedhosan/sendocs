services:
    api:
        build:
            context: ./api
            target: ${API_TARGET:-dev}
        env_file:
            - .env
            - api/.env
        ports:
            - "${API_BIND:-127.0.0.1}:${API_PORT:-8000}:8000"
        volumes:
            - ./api:/var/www/html
            - /var/www/html/vendor
        depends_on:
            db:
                condition: service_healthy
        restart: unless-stopped

    worker:
        build:
            context: ./api
            target: ${API_TARGET:-dev}
        command:
            - php
            - artisan
            - queue:work
            - --sleep=3
            - --tries=3
            - --max-time=3600
        env_file:
            - .env
            - api/.env
        volumes:
            - ./api:/var/www/html
            - /var/www/html/vendor
        depends_on:
            db:
                condition: service_healthy
        restart: unless-stopped

    scheduler:
        build:
            context: ./api
            target: ${API_TARGET:-dev}
        command:
            - php
            - artisan
            - schedule:work
        env_file:
            - .env
            - api/.env
        volumes:
            - ./api:/var/www/html
            - /var/www/html/vendor
        depends_on:
            db:
                condition: service_healthy
        restart: unless-stopped

    web:
        build:
            context: ./web
            target: ${WEB_TARGET:-dev}
        env_file:
            - .env
            - web/.env
        environment:
            VITE_API_PROXY: http://api:8000
        ports:
            - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-3000}:3000"
        volumes:
            - ./web:/app
            - /app/node_modules
        depends_on:
            api:
                condition: service_started
        restart: unless-stopped

    db:
        image: postgres:17-alpine
        env_file:
            - .env
        ports:
            - "${POSTGRES_BIND:-127.0.0.1}:5432:5432"
        volumes:
            - db-data:/var/lib/postgresql/data
        healthcheck:
            test:
                - CMD-SHELL
                - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
            interval: 5s
            timeout: 5s
            retries: 12
        restart: unless-stopped

volumes:
    db-data:
