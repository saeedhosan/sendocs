openapi: 3.1.0

info:
  title: API documentation
  version: "1.0.0"
  summary: Owner session and client magic-link APIs.
  description: |
    Owner routes use a session cookie and require `X-CSRF-Token` for state changes.
    Portal routes use the magic link in the path and set no cookie.

    Errors use `{ "error": { "code": "...", "message": "...", "details": {} } }`.
    `details` appears only for validation errors.

    ## Limits

    These limits define the API contract.

    | Limit | Value |
    | --- | --- |
    | Items per request | 1 to 10 |
    | Request title | 200 characters |
    | Item label | 200 characters |
    | File size | 25 MB, enforced while streaming |
    | Accepted types | PDF, JPEG, PNG, DOCX, XLSX, CSV, TXT |
    | Page size | `limit` defaults to 20, capped at 100 |
    | Magic-link expiry | 14 days default, 90 days maximum |
    | Password length | 8 to 200 characters |

    A type is decided by sniffing the content, never by the `Content-Type` header, and
    the sniffed type must agree with the file extension.

servers:
  - url: http://127.0.0.1:8000
    description: API base URL.

tags:
  - name: Health
  - name: Owner Authentication
  - name: Document Requests
  - name: Client Portal

paths:
  /health:
    get:
      tags: [Health]
      operationId: health
      summary: Check application health.
      description: Used after deployment.
      security: []
      responses:
        "200":
          description: The application is serving traffic.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /api/v1/auth/register:
    post:
      tags: [Owner Authentication]
      operationId: registerOwner
      summary: Register and sign in an owner.
      description: Sets a session cookie and returns a CSRF token. Verification email is queued after commit.
      security: []
      x-rate-limit: { limit: 10, window: 60, key: ip }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Account created, session cookie set.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SessionCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionPayload"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/auth/login:
    post:
      tags: [Owner Authentication]
      operationId: loginOwner
      summary: Sign in with email and password.
      description: Unknown emails and wrong passwords return identical responses; failed attempts also verify a dummy password.
      security: []
      x-rate-limit: { limit: 10, window: 60, key: ip }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Signed in, session cookie set.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SessionCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionPayload"
        "401":
          $ref: "#/components/responses/InvalidCredentials"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/auth/logout:
    post:
      tags: [Owner Authentication]
      operationId: logoutOwner
      summary: Sign out and invalidate the session.
      description: Deletes the session; the old cookie no longer works.
      security: [{ sessionCookie: [] }, { csrfToken: [] }]
      x-rate-limit: { limit: 120, window: 60, key: user }
      responses:
        "204":
          description: Signed out.
          headers:
            Set-Cookie:
              description: |
                The session cookie, expired. The row is already deleted, so this only
                stops the browser from presenting a dead cookie on later requests.
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CsrfFailed"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/auth/session:
    get:
      tags: [Owner Authentication]
      operationId: resolveSession
      summary: Get the current user, CSRF token, and expiry.
      description: Returns `401` when the session is invalid.
      security: [{ sessionCookie: [] }]
      x-rate-limit: { limit: 120, window: 60, key: user }
      responses:
        "200":
          description: The caller and a freshly derived CSRF token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionPayload"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/auth/password/forgot:
    post:
      tags: [Owner Authentication]
      operationId: requestPasswordReset
      summary: Request a password reset.
      description: Returns the same `202` for known and unknown emails; unknown addresses receive no email.
      security: []
      x-rate-limit: { limit: 5, window: 3600, key: ip }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  $ref: "#/components/schemas/Email"
      responses:
        "202":
          description: Accepted, whether or not the address is on file.
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/auth/password/reset:
    post:
      tags: [Owner Authentication]
      operationId: resetPassword
      summary: Reset a password with a token.
      description: The token expires after 60 minutes and is single-use. Success revokes other sessions. Google-only accounts are unsupported.
      security: []
      x-rate-limit: { limit: 5, window: 3600, key: ip }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token:
                  type: string
                  description: Single-use token from the email link. Never log it.
                password:
                  $ref: "#/components/schemas/Password"
      responses:
        "200":
          description: Password changed and the owner is signed in.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SessionCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionPayload"
        "400":
          $ref: "#/components/responses/PasswordNotSupported"
        "410":
          $ref: "#/components/responses/InvalidToken"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/auth/password/change:
    post:
      tags: [Owner Authentication]
      operationId: changePassword
      summary: Change the signed-in owner's password.
      description: Revokes other sessions. Google-only accounts are unsupported.
      security: [{ sessionCookie: [] }, { csrfToken: [] }]
      x-rate-limit: { limit: 120, window: 60, key: user }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, password]
              properties:
                currentPassword:
                  type: string
                  format: password
                password:
                  $ref: "#/components/schemas/Password"
      responses:
        "204":
          description: Password changed.
        "400":
          $ref: "#/components/responses/PasswordNotSupported"
        "401":
          $ref: "#/components/responses/InvalidCredentials"
        "403":
          $ref: "#/components/responses/CsrfFailed"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/auth/email/verify:
    get:
      tags: [Owner Authentication]
      operationId: verifyEmail
      summary: Verify an email address.
      description: Email verification is not required to use the product.
      security: []
      x-rate-limit: { limit: 5, window: 3600, key: ip }
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
          description: |
            The raw token from the link. Never logged.

            A query parameter is accepted here because this token is single-use and
            expires in an hour, unlike the long-lived magic link, which must live in the
            path so it can be redacted from logs and referrers.
      responses:
        "200":
          description: Address verified.
          content:
            application/json:
              schema:
                type: object
                required: [emailVerifiedAt]
                properties:
                  emailVerifiedAt:
                    type: string
                    format: date-time
        "410":
          $ref: "#/components/responses/InvalidToken"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/auth/email/resend:
    post:
      tags: [Owner Authentication]
      operationId: resendVerification
      summary: Resend the verification email.
      description: Queued for delivery.
      security: [{ sessionCookie: [] }, { csrfToken: [] }]
      x-rate-limit: { limit: 5, window: 3600, key: user }
      responses:
        "202":
          description: Accepted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CsrfFailed"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/auth/oauth/google:
    get:
      tags: [Owner Authentication]
      operationId: oauthGoogleStart
      summary: Start Google sign-in.
      description: Starts OAuth with PKCE and state; returns the Google authorization URL.
      security: []
      x-rate-limit: { limit: 10, window: 60, key: ip }
      responses:
        "200":
          description: Authorization URL.
          content:
            application/json:
              schema:
                type: object
                required: [authUrl]
                properties:
                  authUrl:
                    type: string
                    format: uri
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/auth/oauth/google/callback:
    get:
      tags: [Owner Authentication]
      operationId: oauthGoogleCallback
      summary: Complete Google sign-in.
      description: Validates OAuth state and the Google ID token, then creates or links the account and sets a session cookie. Provider conflicts return `409`; invalid state or tokens return `400`.
      security: []
      x-rate-limit: { limit: 10, window: 60, key: ip }
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
        - name: state
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Signed in, session cookie set.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SessionCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionPayload"
        "400":
          $ref: "#/components/responses/OAuthFailed"
        "409":
          $ref: "#/components/responses/OAuthProviderConflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/auth/account:
    delete:
      tags: [Owner Authentication]
      operationId: deleteAccount
      summary: Delete the owner account and its data.
      description: Requires the password and email confirmation. Metadata is deleted immediately; stored files are cleaned up afterwards.
      security: [{ sessionCookie: [] }, { csrfToken: [] }]
      x-rate-limit: { limit: 120, window: 60, key: user }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password, confirm]
              properties:
                password:
                  type: string
                  format: password
                confirm:
                  $ref: "#/components/schemas/Email"
      responses:
        "204":
          description: Account deleted.
          headers:
            Set-Cookie:
              description: Expires the now-dead session cookie.
              schema: { type: string }
        "400":
          $ref: "#/components/responses/PasswordNotSupported"
        "401":
          $ref: "#/components/responses/InvalidCredentials"
        "403":
          $ref: "#/components/responses/CsrfFailed"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/requests:
    get:
      tags: [Document Requests]
      operationId: listRequests
      summary: List the owner's requests and progress.
      description: Cursor-paginated by creation time, newest first. Other owners' requests are never exposed.
      security: [{ sessionCookie: [] }]
      x-rate-limit: { limit: 120, window: 60, key: user }
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of requests.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"

    post:
      tags: [Document Requests]
      operationId: createRequest
      summary: Create a request and its items.
      description: The magic link is returned only in this response. Display it once and do not persist it client-side.
      security: [{ sessionCookie: [] }, { csrfToken: [] }]
      x-rate-limit: { limit: 120, window: 60, key: user }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRequestInput"
      responses:
        "201":
          description: Created, with items in the submitted order and the one-time link.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CsrfFailed"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/requests/{requestId}:
    parameters:
      - $ref: "#/components/parameters/RequestId"
    get:
      tags: [Document Requests]
      operationId: showRequest
      summary: Get a request, its items, and download URLs.
      description: Other owners' requests return the same `404` as missing IDs. Download URLs expire after five minutes and are not cached.
      security: [{ sessionCookie: [] }]
      x-rate-limit: { limit: 120, window: 60, key: user }
      responses:
        "200":
          description: The request, its items, and a signed URL per uploaded document.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"

    delete:
      tags: [Document Requests]
      operationId: deleteRequest
      summary: Delete a request and its files.
      description: Invalidates the magic link and schedules stored-file cleanup. This action is irreversible.
      security: [{ sessionCookie: [] }, { csrfToken: [] }]
      x-rate-limit: { limit: 120, window: 60, key: user }
      responses:
        "204":
          description: Request, items, documents, and the link are gone.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CsrfFailed"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/requests/{requestId}/revoke:
    parameters:
      - $ref: "#/components/parameters/RequestId"
    post:
      tags: [Document Requests]
      operationId: revokeMagicLink
      summary: Revoke a request's magic link.
      description: Idempotent and permanent. The owner can still view the request and files; the link cannot be restored.
      security: [{ sessionCookie: [] }, { csrfToken: [] }]
      x-rate-limit: { limit: 120, window: 60, key: user }
      responses:
        "200":
          description: The request with `revokedAt` set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CsrfFailed"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/requests/{requestId}/items/{itemId}/document:
    parameters:
      - $ref: "#/components/parameters/RequestId"
      - $ref: "#/components/parameters/ItemId"
    delete:
      tags: [Document Requests]
      operationId: deleteDocument
      summary: Delete an uploaded document.
      description: The item returns to `waiting`, so derived progress may decrease. Foreign items and items without a file return `404`.
      security: [{ sessionCookie: [] }, { csrfToken: [] }]
      x-rate-limit: { limit: 120, window: 60, key: user }
      responses:
        "204":
          description: Document removed, and the item is waiting again.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CsrfFailed"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/portal/{token}:
    get:
      tags: [Client Portal]
      operationId: showPortal
      summary: Open the client portal with a magic link.
      description: |
        No cookie or CSRF token is used. Invalid, expired, revoked, or malformed links
        return the same `410`. Never log the token; responses use
        `Referrer-Policy: no-referrer`.
      security: []
      x-rate-limit: { limit: 60, window: 60, key: ip }
      parameters:
        - $ref: "#/components/parameters/PortalToken"
      responses:
        "200":
          description: The link is live.
          headers:
            Referrer-Policy:
              description: Always `no-referrer` on this route.
              schema:
                type: string
                const: no-referrer
            Set-Cookie:
              description: Never sent; this surface sets no cookie.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalView"
        "410":
          $ref: "#/components/responses/InvalidLink"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/portal/{token}/items/{itemId}/file:
    post:
      tags: [Client Portal]
      operationId: uploadPortalFile
      summary: Upload a file for one portal item.
      description: Authorization is checked before reading the body. Each item accepts one file; duplicates return `409`. Uploads are not resumable.
      security: []
      x-rate-limit: { limit: 30, window: 3600, key: ip }
      parameters:
        - $ref: "#/components/parameters/PortalToken"
        - $ref: "#/components/parameters/ItemId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: |
                    At most 25 MB. The type is sniffed from the content and must be one
                    of PDF, JPEG, PNG, DOCX, XLSX, CSV, or TXT, and must agree with the
                    file extension. The filename is display only and never becomes a path.
      responses:
        "200":
          description: Stored, with the updated portal view.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalView"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/DuplicateUpload"
        "410":
          $ref: "#/components/responses/InvalidLink"
        "413":
          $ref: "#/components/responses/FileTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedType"
        "429":
          $ref: "#/components/responses/RateLimited"

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: sendocs_session
      description: |
        An opaque session cookie. `HttpOnly`, `Secure` in production, `SameSite=Lax`,
        `Path=/`, with an absolute seven-day expiry. Only its hash is stored, so a
        database leak yields no usable cookie.
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: |
        A token derived from the session id, required on every state-changing owner
        request. Never readable from a cookie.

  headers:
    SessionCookie:
      description: Opaque session cookie set on registration, login, and password reset.
      schema:
        type: string
    RetryAfter:
      description: Seconds to wait before retrying.
      schema:
        type: integer
        minimum: 0

  parameters:
    RequestId:
      name: requestId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ItemId:
      name: itemId
      in: path
      required: true
      description: Scoped to the request identified by the same token.
      schema:
        type: string
        format: uuid
    PortalToken:
      name: token
      in: path
      required: true
      description: |
        The raw magic-link token. Treat as a live secret: never log it, never put it in
        a query string, and redact it from any error report.

        No length or character constraint is declared on purpose: a malformed token must
        reach `MagicLinkGuard`, which rejects it without touching the database and
        returns the same `410 invalid_link` as an unknown, expired, or revoked token.
      schema:
        type: string
      example: 8mQd1r4xJ0nP2vYc6bT3wZ9aL5eH7sK
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor for the last seen `created_at` and `id`; tampering returns `422`.
      schema:
        type: string

  responses:
    Unauthorized:
      description: Missing, malformed, unknown, or expired session.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: unauthenticated
              message: Sign in to continue.
    InvalidCredentials:
      description: |
        Wrong password, or an address that is not registered. Both cases return a
        byte-identical body.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: invalid_credentials
              message: Email or password is incorrect.
    CsrfFailed:
      description: Valid session, but the `X-CSRF-Token` header is missing or does not match.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: csrf_failed
              message: Refresh the page and try again.
    NotFound:
      description: Missing or owned by another caller; both return the same body.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: not_found
              message: Not found.
    InvalidLink:
      description: Unknown, malformed, expired, or revoked magic link. All cases return the same body.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: invalid_link
              message: This link is no longer valid.
    InvalidToken:
      description: Reset or verification token unknown, expired, or already used.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: invalid_token
              message: This link has expired or has already been used.
    Conflict:
      description: The email address is already registered.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: email_taken
              message: That email address is already registered.
    OAuthFailed:
      description: The Google OAuth flow could not be completed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: oauth_failed
              message: Google sign-in failed. Try again.
    OAuthProviderConflict:
      description: Email exists under a different provider.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: oauth_provider_conflict
              message: That email is already registered with a different sign-in method.
    PasswordNotSupported:
      description: Password operations not supported for Google-only accounts.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: password_not_supported
              message: Password operations are not available for this account.
    DuplicateUpload:
      description: The item already has a file, so this upload was discarded.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: duplicate_upload
              message: A file has already been uploaded for this item.
    FileTooLarge:
      description: Over the 25 MB cap, rejected before the body was buffered.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: file_too_large
              message: The file is larger than 25 MB.
    UnsupportedType:
      description: The sniffed type is not allowed, or it disagrees with the file extension.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: unsupported_type
              message: That file type is not accepted.
    ValidationFailed:
      description: Validation errors include a `details` map keyed by field.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationError"
          example:
            error:
              code: validation_failed
              message: Check the highlighted fields.
              details:
                items: "Between 1 and 10 items are required."
    RateLimited:
      description: Rate limit exceeded.
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: rate_limited
              message: Too many requests. Try again shortly.
    InternalError:
      description: Unexpected error; internal details are never returned.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: internal_error
              message: Something went wrong. Please try again.

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Stable machine-readable code.
            message:
              type: string
              description: Human-readable message.
            details:
              type: object
              additionalProperties: true
              description: Field errors, present only for validation failures.

    ValidationError:
      allOf:
        - $ref: "#/components/schemas/Error"
        - type: object
          required: [error]
          properties:
            error:
              type: object
              required: [details]
              properties:
                details:
                  type: object
                  additionalProperties: true

    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: ok

    Email:
      type: string
      format: email
      maxLength: 254
      description: Trimmed and lowercased.

    Password:
      type: string
      format: password
      minLength: 8
      maxLength: 200
      description: Length only; no character-composition rules.

    User:
      type: object
      required: [id, name, email]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 120
        email:
          $ref: "#/components/schemas/Email"
        emailVerifiedAt:
          type: string
          format: date-time
          description: Null until verified; verification is not required to use the product.

    SessionPayload:
      type: object
      required: [user, csrfToken, expiresAt]
      properties:
        user:
          $ref: "#/components/schemas/User"
        csrfToken:
          type: string
          description: |
            Send as `X-CSRF-Token` on every state-changing request. Held in memory by
            the client and never stored.
        expiresAt:
          type: string
          format: date-time
          description: Absolute expiry, seven days out. There is no sliding renewal.

    RegisterRequest:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        email:
          $ref: "#/components/schemas/Email"
        password:
          $ref: "#/components/schemas/Password"

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          $ref: "#/components/schemas/Email"
        password:
          type: string
          format: password

    ProgressStatus:
      type: string
      enum: [waiting, complete]
      description: |
        `complete` when every item has a document, otherwise `waiting`. Derived on read
        and never stored, so it cannot disagree with the files.

    ItemState:
      type: string
      enum: [waiting, uploaded]
      description: "'uploaded' means exactly one thing: the item has a document."

    CreateRequestInput:
      type: object
      required: [title, items]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
          description: Trimmed and whitespace-collapsed; blank titles return `422`.
        items:
          type: array
          minItems: 1
          maxItems: 10
          description: Labels in display order; duplicates are allowed.
          items:
            type: object
            required: [label]
            properties:
              label:
                type: string
                minLength: 1
                maxLength: 200
                description: Trimmed; blank labels return `422`.

    MagicLink:
      type: object
      required: [url, expiresAt]
      properties:
        url:
          type: string
          format: uri
          description: |
            The full link, returned exactly once. Never returned by any other endpoint,
            and never persist it client-side.
        expiresAt:
          type: string
          format: date-time
          description: 14 days after creation, clamped to a 90-day maximum.

    RequestSummary:
      type: object
      required: [id, title, status, uploaded, total, createdAt, expiresAt]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          maxLength: 200
        status:
          $ref: "#/components/schemas/ProgressStatus"
        uploaded:
          type: integer
          minimum: 0
          maximum: 10
        total:
          type: integer
          minimum: 1
          maximum: 10
        lastActivityAt:
          type: string
          format: date-time
          nullable: true
          description: Latest upload, or null if none.
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        revokedAt:
          type: string
          format: date-time
          nullable: true

    Document:
      type: object
      required: [id, originalName, mimeType, sizeBytes, uploadedAt]
      properties:
        id:
          type: string
          format: uuid
        originalName:
          type: string
          maxLength: 255
          description: Display only; never used in paths or storage keys.
        mimeType:
          type: string
          description: Detected from file content, not the request header.
        sizeBytes:
          type: integer
          minimum: 1
        uploadedAt:
          type: string
          format: date-time
        downloadUrl:
          type: string
          format: uri
          nullable: true
          description: |
            Presigned object-storage URL, valid for five minutes and served with
            `attachment` and `nosniff`. Null when the item has no document.

            Owner surface only, so this field never appears in `PortalView`: the portal
            has its own item schema that carries no URL, key, or `mimeType`.

    RequestItem:
      type: object
      description: Owner surface only. Carries the full document, including its download URL.
      required: [id, label, position, state]
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string
          maxLength: 200
          description: Owner-written text. Treat as untrusted input.
        position:
          type: integer
          minimum: 1
          maximum: 10
        state:
          $ref: "#/components/schemas/ItemState"
        document:
          oneOf:
            - $ref: "#/components/schemas/Document"
            - type: "null"

    RequestDetail:
      type: object
      required:
        [id, title, status, uploaded, total, createdAt, expiresAt, items]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          maxLength: 200
        status:
          $ref: "#/components/schemas/ProgressStatus"
        uploaded:
          type: integer
          minimum: 0
          maximum: 10
        total:
          type: integer
          minimum: 1
          maximum: 10
        lastActivityAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        revokedAt:
          type: string
          format: date-time
          nullable: true
        items:
          type: array
          minItems: 1
          maxItems: 10
          items:
            $ref: "#/components/schemas/RequestItem"

    CreatedRequest:
      type: object
      required: [request, link]
      properties:
        request:
          $ref: "#/components/schemas/RequestDetail"
        link:
          $ref: "#/components/schemas/MagicLink"

    RequestPage:
      type: object
      required: [data, nextCursor]
      properties:
        data:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/RequestSummary"
        nextCursor:
          type: string
          nullable: true
          description: Null on the last page.

    PortalView:
      type: object
      required:
        [title, status, uploaded, total, lastActivityAt, expiresAt, items]
      properties:
        title:
          type: string
          maxLength: 200
          description: Owner-written text; render as text, not markup.
        status:
          $ref: "#/components/schemas/ProgressStatus"
        uploaded:
          type: integer
          minimum: 0
          maximum: 10
        total:
          type: integer
          minimum: 1
          maximum: 10
        lastActivityAt:
          type: string
          format: date-time
          nullable: true
          description: Newest upload on this request, or null when nothing has been uploaded.
        expiresAt:
          type: string
          format: date-time
          description: Time when the link expires.
        items:
          type: array
          minItems: 1
          maxItems: 10
          description: Includes all items, whether uploaded or not.
          items:
            $ref: "#/components/schemas/PortalItem"

    PortalItem:
      type: object
      required: [id, label, position, state, file]
      description: |
        The client-visible item. It carries only what the client already knows: there is
        no `downloadUrl`, no storage key, no `mimeType`, and no owner identity anywhere in
        this surface.
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string
          maxLength: 200
          description: Untrusted owner text; render as a text node.
        position:
          type: integer
          minimum: 1
          maximum: 10
        state:
          $ref: "#/components/schemas/ItemState"
        file:
          description: What this client uploaded, or null while the item is waiting.
          oneOf:
            - type: object
              required: [originalName, sizeBytes, uploadedAt]
              properties:
                originalName:
                  type: string
                  maxLength: 255
                  description: Display only; never used in paths or keys.
                sizeBytes:
                  type: integer
                  minimum: 1
                uploadedAt:
                  type: string
                  format: date-time
            - type: "null"
