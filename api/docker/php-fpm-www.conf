[www]
user = www-data
group = www-data

listen = 9000
listen.owner = www-data
listen.group = www-data
listen.backlog = 1024

; Use a pre-forked pool for bursty benchmark traffic. The 1,500-VU test
; starts all virtual users together, so dynamic worker creation adds avoidable
; startup latency while the pool scales from its initial four workers.
pm = static
pm.max_children = 16
pm.max_requests = 500

; Temporary diagnostics: log PHP requests taking longer than 5 seconds.
request_slowlog_timeout = 5s
slowlog = /proc/self/fd/2
request_slowlog_trace_depth = 20

clear_env = no
catch_workers_output = yes
decorate_workers_output = no
