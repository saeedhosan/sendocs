openapi: 3.1.0

info:
  title: Sendocs API
  version: "1.0.0"
  summary: Owner session API and client magic-link API, served from one origin.
  description: |
    Two credentials that never intersect.

    Owner routes require a session cookie, plus an `X-CSRF-Token` header on every
    state-changing request. Portal routes carry the magic link in the path and set no
    cookie, so they take no CSRF token either.

    Every error uses one envelope:

    ```json
    { "error": { "code": "validation_failed", "message": "…", "details": {} } }
    ```

    `code` is stable and machine-readable. `message` is human-readable. `details`
    appears only on validation failures.

    ## Published limits

    This document is the single source for the numbers a client is allowed to check
    before acting.

    | Limit | Value |
    | --- | --- |
    | Items per request | 1 to 10 |
    | Request title | 200 characters |
    | Item label | 200 characters |
    | File size | 25 MB, enforced while streaming |
    | Accepted types | PDF, JPEG, PNG, DOCX, XLSX, CSV, TXT |
    | Page size | `limit` defaults to 20, capped at 100 |
    | Magic-link expiry | 14 days default, 90 days maximum |
    | Password length | 12 to 200 characters |

    A type is decided by sniffing the content, never by the `Content-Type` header, and
    the sniffed type must agree with the file extension.

servers:
  - url: https://{host}
    description: One origin serves the UI and the API.
    variables:
      host:
        default: app.example.test
        description: Deploy-time application host. Never derived from a request.

tags:
  - name: Health
  - name: Owner Authentication
  - name: Document Requests
  - name: Client Portal

paths:
  /health:
    get:
      tags: [Health]
      operationId: health
      summary: Liveness and readiness check.
      description: Used by the deploy pipeline after a release.
      security: []
      responses:
        "200":
          description: The application is serving traffic.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /api/v1/auth/register:
    post:
      tags: [Owner Authentication]
      operationId: registerOwner
      summary: Create an owner account and sign it in.
      description: |
        Sets the session cookie and returns a CSRF token. The verification email is
        dispatched from the queue after commit, so it is never sent for a rolled-back
        registration.
      security: []
      x-rate-limit: { limit: 10, window: 60, key: ip }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Account created, session cookie set.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SessionCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionPayload"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/auth/login:
    post:
      tags: [Owner Authentication]
      operationId: loginOwner
      summary: Exchange credentials for a session cookie.
      description: |
        A wrong password and an unknown address return byte-identical bodies, and a
        failed attempt still runs a dummy password verification, so timing never
        reveals whether an address exists.
      security: []
      x-rate-limit: { limit: 10, window: 60, key: ip }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Signed in, session cookie set.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SessionCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionPayload"
        "401":
          $ref: "#/components/responses/InvalidCredentials"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/auth/logout:
    post:
      tags: [Owner Authentication]
      operationId: logoutOwner
      summary: Destroy the current session.
      description: The session row is deleted, so the old cookie is inert afterwards.
      security: [{ sessionCookie: [] }, { csrfToken: [] }]
      x-rate-limit: { limit: 120, window: 60, key: user }
      responses:
        "204":
          description: Signed out.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CsrfFailed"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/auth/session:
    get:
      tags: [Owner Authentication]
      operationId: resolveSession
      summary: Resolve the caller, CSRF token, and session expiry.
      description: |
        The only unauthenticated-shaped read that touches the session itself. It returns
        `401` rather than an empty user, so a client never has to interpret a null user.
      security: [{ sessionCookie: [] }]
      x-rate-limit: { limit: 120, window: 60, key: user }
      responses:
        "200":
          description: The caller and a freshly derived CSRF token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionPayload"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/auth/password/forgot:
    post:
      tags: [Owner Authentication]
      operationId: requestPasswordReset
      summary: Send a reset link to the address on file.
      description: |
        Returns an identical `202` for known and unknown addresses, and sends nothing
        when the address is unknown, so it cannot be used to enumerate accounts.
      security: []
      x-rate-limit: { limit: 5, window: 3600, key: ip }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  $ref: "#/components/schemas/Email"
      responses:
        "202":
          description: Accepted, whether or not the address is on file.
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/auth/password/reset:
    post:
      tags: [Owner Authentication]
      operationId: resetPassword
      summary: Redeem a reset token and set a new password.
      description: |
        The token is single-use and expires after 60 minutes. On success every other
        session for that owner is revoked. Password reset is not supported for accounts
        that do not have a password (Google-only).
      security: []
      x-rate-limit: { limit: 5, window: 3600, key: ip }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token:
                  type: string
                  description: The raw token from the emailed link. Never logged.
                password:
                  $ref: "#/components/schemas/Password"
      responses:
        "200":
          description: Password changed and the owner is signed in.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SessionCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionPayload"
        "400":
          $ref: "#/components/responses/PasswordNotSupported"
        "410":
          $ref: "#/components/responses/InvalidToken"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/auth/password/change:
    post:
      tags: [Owner Authentication]
      operationId: changePassword
      summary: Change the password while signed in.
      description: |
        Revokes every other session for the owner on success.
        Not supported for Google-only accounts.
      security: [{ sessionCookie: [] }, { csrfToken: [] }]
      x-rate-limit: { limit: 120, window: 60, key: user }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, password]
              properties:
                currentPassword:
                  type: string
                  format: password
                password:
                  $ref: "#/components/schemas/Password"
      responses:
        "204":
          description: Password changed.
        "400":
          $ref: "#/components/responses/PasswordNotSupported"
        "401":
          $ref: "#/components/responses/InvalidCredentials"
        "403":
          $ref: "#/components/responses/CsrfFailed"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/auth/email/verify:
    get:
      tags: [Owner Authentication]
      operationId: verifyEmail
      summary: Redeem a verification token from the email link.
      description: |
        Verification gates nothing today: an unverified owner can use the product
        immediately.
      security: []
      x-rate-limit: { limit: 5, window: 3600, key: ip }
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
          description: |
            The raw token from the link. Never logged.

            A query parameter is accepted here because this token is single-use and
            expires in an hour, unlike the long-lived magic link, which must live in the
            path so it can be redacted from logs and referrers.
      responses:
        "200":
          description: Address verified.
          content:
            application/json:
              schema:
                type: object
                required: [emailVerifiedAt]
                properties:
                  emailVerifiedAt:
                    type: string
                    format: date-time
        "410":
          $ref: "#/components/responses/InvalidToken"

  /api/v1/auth/email/resend:
    post:
      tags: [Owner Authentication]
      operationId: resendVerification
      summary: Send a new verification link.
      description: Dispatch is queued, so a lost job is recoverable by resending.
      security: [{ sessionCookie: [] }, { csrfToken: [] }]
      x-rate-limit: { limit: 5, window: 3600, key: user }
      responses:
        "202":
          description: Accepted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CsrfFailed"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/auth/oauth/google:
    get:
      tags: [Owner Authentication]
      operationId: oauthGoogleStart
      summary: Initiate Google OAuth.
      description: |
        Starts the Google OAuth 2.0 Authorization Code flow with PKCE and state.
        Returns the authorization URL to redirect the user to Google.
      security: []
      x-rate-limit: { limit: 10, window: 60, key: ip }
      responses:
        "200":
          description: Authorization URL.
          content:
            application/json:
              schema:
                type: object
                required: [authUrl]
                properties:
                  authUrl:
                    type: string
                    format: uri
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/auth/oauth/google/callback:
    get:
      tags: [Owner Authentication]
      operationId: oauthGoogleCallback
      summary: Handle Google OAuth callback.
      description: |
        Exchanges the authorization code for tokens, verifies the Google ID token,
        and creates or links the account. On success, sets the session cookie.
        If an email exists under a different provider, returns 409.
      security: []
      x-rate-limit: { limit: 10, window: 60, key: ip }
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
        - name: state
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Signed in, session cookie set.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SessionCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionPayload"
        "409":
          $ref: "#/components/responses/OAuthProviderConflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/auth/account:
    delete:
      tags: [Owner Authentication]
      operationId: deleteAccount
      summary: Delete the owner account and everything it owns.
      description: |
        Requires the password and the address typed as confirmation, so a replayed
        request cannot trigger it. Metadata is removed in one cascading statement;
        stored objects are removed afterwards by a cleanup job.
      security: [{ sessionCookie: [] }, { csrfToken: [] }]
      x-rate-limit: { limit: 120, window: 60, key: user }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password, confirm]
              properties:
                password:
                  type: string
                  format: password
                confirm:
                  $ref: "#/components/schemas/Email"
      responses:
        "204":
          description: Account deleted.
        "401":
          $ref: "#/components/responses/InvalidCredentials"
        "403":
          $ref: "#/components/responses/CsrfFailed"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/requests:
    get:
      tags: [Document Requests]
      operationId: listRequests
      summary: List the caller's own requests with progress.
      description: |
        Cursor-paginated on creation time descending. Every request in the page carries
        its own counts, so the list costs one additional grouped query per page and
        never one query per row.

        Another owner's request never appears, and no endpoint discloses that one exists.
      security: [{ sessionCookie: [] }]
      x-rate-limit: { limit: 120, window: 60, key: user }
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of requests.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"

    post:
      tags: [Document Requests]
      operationId: createRequest
      summary: Create a request with its required items.
      description: |
        The response carries the magic link exactly once. It is never returned by any
        other endpoint, so a client must render it from this response and persist it
        nowhere.
      security: [{ sessionCookie: [] }, { csrfToken: [] }]
      x-rate-limit: { limit: 120, window: 60, key: user }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRequestInput"
      responses:
        "201":
          description: Created, with items in the submitted order and the one-time link.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CsrfFailed"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/requests/{requestId}:
    parameters:
      - $ref: "#/components/parameters/RequestId"
    get:
      tags: [Document Requests]
      operationId: showRequest
      summary: One request with its items and signed download URLs.
      description: |
        A request owned by another owner returns `404` with a body identical to a
        nonexistent id, so existence is never disclosed.

        Download URLs are presigned object-storage links valid for five minutes. They
        are minted per view, carry `attachment` and `nosniff`, and are never cached.
      security: [{ sessionCookie: [] }]
      x-rate-limit: { limit: 120, window: 60, key: user }
      responses:
        "200":
          description: The request, its items, and a signed URL per uploaded document.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"

    delete:
      tags: [Document Requests]
      operationId: deleteRequest
      summary: Delete the request and every file in it.
      description: |
        Metadata is removed in one cascading statement, so deleting the row also
        invalidates the magic link. Stored objects are deleted after the commit and
        retried from a queue if that fails.

        This is irreversible, and the response does not wait for object deletion.
      security: [{ sessionCookie: [] }, { csrfToken: [] }]
      x-rate-limit: { limit: 120, window: 60, key: user }
      responses:
        "204":
          description: Request, items, documents, and the link are gone.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CsrfFailed"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/requests/{requestId}/revoke:
    parameters:
      - $ref: "#/components/parameters/RequestId"
    post:
      tags: [Document Requests]
      operationId: revokeMagicLink
      summary: Revoke the client magic link.
      description: |
        Idempotent: a second call returns the same `200`. The request row stays, so the
        owner keeps reading it and downloading its files.

        Revocation is permanent. There is no un-revoke and no regeneration, so a new
        request is the only way forward.
      security: [{ sessionCookie: [] }, { csrfToken: [] }]
      x-rate-limit: { limit: 120, window: 60, key: user }
      responses:
        "200":
          description: The request with `revokedAt` set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CsrfFailed"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/requests/{requestId}/items/{itemId}/document:
    parameters:
      - $ref: "#/components/parameters/RequestId"
      - $ref: "#/components/parameters/ItemId"
    delete:
      tags: [Document Requests]
      operationId: deleteDocument
      summary: Delete one uploaded document.
      description: |
        The owner's recovery path for a mis-uploaded or unwanted file: the item returns
        to `waiting`, so the client can upload it again.

        The item must belong to the request in the path, so a foreign `itemId` is `404`.
        An item with no document is also `404`, so a repeated call is not a second delete.

        The row is removed first and the object afterwards, with deletion retried from a
        queue if the storage call fails. Progress therefore moves backwards, because it is
        derived rather than stored.
      security: [{ sessionCookie: [] }, { csrfToken: [] }]
      x-rate-limit: { limit: 120, window: 60, key: user }
      responses:
        "204":
          description: Document removed, and the item is waiting again.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CsrfFailed"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/portal/{token}:
    get:
      tags: [Client Portal]
      operationId: showPortal
      summary: Authenticate a client by magic link and return the portal view.
      description: |
        The link is the whole credential: there is no cookie, no session, and no CSRF
        token in this surface.

        Unknown, malformed, expired, revoked, and tampered links all return one
        identical `410` body, so a caller cannot tell a wrong link from a dead one or
        confirm that a request ever existed. A malformed token is rejected before any
        database query.

        The token is a secret. Do not log it, and send `Referrer-Policy: no-referrer`.
      security: []
      x-rate-limit: { limit: 60, window: 60, key: ip }
      parameters:
        - $ref: "#/components/parameters/PortalToken"
      responses:
        "200":
          description: The link is live.
          headers:
            Referrer-Policy:
              description: Always `no-referrer` on this route.
              schema:
                type: string
                const: no-referrer
            Set-Cookie:
              description: Never sent; this surface sets no cookie.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalView"
        "410":
          $ref: "#/components/responses/InvalidLink"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/portal/{token}/items/{itemId}/file:
    post:
      tags: [Client Portal]
      operationId: uploadPortalFile
      summary: Upload one file for one required item.
      description: |
        Authorization is settled before a single body byte is read, so a dead link
        cannot probe the upload path or the size limit.

        One file per item: a second upload to the same item is `409`, and the first
        file is kept. The size cap is enforced while streaming, so an oversized body is
        rejected before it is buffered.

        Uploads are not resumable. A transfer that fails must start again from zero.
      security: []
      x-rate-limit: { limit: 30, window: 3600, key: ip }
      parameters:
        - $ref: "#/components/parameters/PortalToken"
        - $ref: "#/components/parameters/ItemId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: |
                    At most 25 MB. The type is sniffed from the content and must be one
                    of PDF, JPEG, PNG, DOCX, XLSX, CSV, or TXT, and must agree with the
                    file extension. The filename is display only and never becomes a path.
      responses:
        "200":
          description: Stored, with the updated portal view.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalView"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/DuplicateUpload"
        "410":
          $ref: "#/components/responses/InvalidLink"
        "413":
          $ref: "#/components/responses/FileTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedType"
        "429":
          $ref: "#/components/responses/RateLimited"

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: sendocs_session
      description: |
        An opaque session cookie. `HttpOnly`, `Secure` in production, `SameSite=Lax`,
        `Path=/`, with an absolute seven-day expiry. Only its hash is stored, so a
        database leak yields no usable cookie.
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: |
        A token derived from the session id, required on every state-changing owner
        request. Never readable from a cookie.

  headers:
    SessionCookie:
      description: The opaque session cookie, set on register, login, and password reset.
      schema:
        type: string
    RetryAfter:
      description: Whole seconds to wait before retrying.
      schema:
        type: integer
        minimum: 0

  parameters:
    RequestId:
      name: requestId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ItemId:
      name: itemId
      in: path
      required: true
      description: Scoped by the request resolved from the same token.
      schema:
        type: string
        format: uuid
    PortalToken:
      name: token
      in: path
      required: true
      description: |
        The raw magic-link token. Treat as a live secret: never log it, never put it in
        a query string, and redact it from any error report.

        No length or character constraint is declared on purpose: a malformed token must
        reach `MagicLinkGuard`, which rejects it without touching the database and
        returns the same `410 invalid_link` as an unknown, expired, or revoked token.
      schema:
        type: string
      example: 8mQd1r4xJ0nP2vYc6bT3wZ9aL5eH7sK
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque, encodes the last seen `created_at` and `id`. A tampered cursor is `422`.
      schema:
        type: string

  responses:
    Unauthorized:
      description: Missing, malformed, unknown, or expired session.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: unauthenticated
              message: Sign in to continue.
    InvalidCredentials:
      description: |
        Wrong password, or an address that is not registered. Both cases return a
        byte-identical body.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: invalid_credentials
              message: Email or password is incorrect.
    CsrfFailed:
      description: Valid session, but the `X-CSRF-Token` header is missing or does not match.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: csrf_failed
              message: Refresh the page and try again.
    NotFound:
      description: Missing, or owned by another caller. The body never distinguishes the two.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: not_found
              message: Not found.
    InvalidLink:
      description: |
        Magic link unknown, malformed, expired, revoked, or tampered. One identical body covers all
        four cases.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: invalid_link
              message: This link is no longer valid.
    InvalidToken:
      description: Reset or verification token unknown, expired, or already used.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: invalid_token
              message: This link has expired or has already been used.
    Conflict:
      description: The email address is already registered.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: email_taken
              message: That email address is already registered.
    OAuthProviderConflict:
      description: Email exists under a different provider.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: oauth_provider_conflict
              message: That email is already registered with a different sign-in method.
    PasswordNotSupported:
      description: Password operations not supported for Google-only accounts.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: password_not_supported
              message: Password operations are not available for this account.
    DuplicateUpload:
      description: The item already has a file, so this upload was discarded.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: duplicate_upload
              message: A file has already been uploaded for this item.
    FileTooLarge:
      description: Over the 25 MB cap, rejected before the body was buffered.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: file_too_large
              message: The file is larger than 25 MB.
    UnsupportedType:
      description: The sniffed type is not allowed, or it disagrees with the file extension.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: unsupported_type
              message: That file type is not accepted.
    ValidationFailed:
      description: Field-level failure, with a `details` map keyed by field name.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationError"
          example:
            error:
              code: validation_failed
              message: Check the highlighted fields.
              details:
                items: "Between 1 and 10 items are required."
    RateLimited:
      description: The bucket for this operation is exhausted.
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: rate_limited
              message: Too many requests. Try again shortly.
    InternalError:
      description: Unexpected failure. Returns a correlation id and never any internals.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: internal_error
              message: Something went wrong. Please try again.
              details:
                correlationId: 0f1c2d3e-4a5b-6c7d-8e9f-0a1b2c3d4e5f

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable, machine-readable error code.
        message:
          type: string
          description: Human-readable summary.
        details:
          type: object
          additionalProperties: true
          description: Present only on validation failures, keyed by field name.

    ValidationError:
      allOf:
        - $ref: "#/components/schemas/Error"
        - type: object
          properties:
            details:
              type: object
              additionalProperties: true

    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: ok

    Email:
      type: string
      format: email
      maxLength: 254
      description: Trimmed and lowercased before comparison.

    Password:
      type: string
      format: password
      minLength: 12
      maxLength: 200
      description: Length is the only rule. No composition requirements.

    User:
      type: object
      required: [id, name, email]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 120
        email:
          $ref: "#/components/schemas/Email"
        emailVerifiedAt:
          type: string
          format: date-time
          description: Null while unverified. Verification gates nothing today.

    SessionPayload:
      type: object
      required: [user, csrfToken, expiresAt]
      properties:
        user:
          $ref: "#/components/schemas/User"
        csrfToken:
          type: string
          description: |
            Send as `X-CSRF-Token` on every state-changing request. Held in memory by
            the client and never stored.
        expiresAt:
          type: string
          format: date-time
          description: Absolute expiry, seven days out. There is no sliding renewal.

    RegisterRequest:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        email:
          $ref: "#/components/schemas/Email"
        password:
          $ref: "#/components/schemas/Password"

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          $ref: "#/components/schemas/Email"
        password:
          type: string
          format: password

    ProgressStatus:
      type: string
      enum: [waiting, complete]
      description: |
        `complete` when every item has a document, otherwise `waiting`. Derived on read
        and never stored, so it cannot disagree with the files.

    ItemState:
      type: string
      enum: [waiting, uploaded]
      description: "'uploaded' means exactly one thing: the item has a document."

    CreateRequestInput:
      type: object
      required: [title, items]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
          description: Trimmed, whitespace collapsed, and an all-whitespace title is `422`.
        items:
          type: array
          minItems: 1
          maxItems: 10
          description: Labels in display order. Duplicate labels are allowed.
          items:
            type: object
            required: [label]
            properties:
              label:
                type: string
                minLength: 1
                maxLength: 200
                description: Trimmed; an empty label is `422`.

    MagicLink:
      type: object
      required: [url, expiresAt]
      properties:
        url:
          type: string
          format: uri
          description: |
            The full link, returned exactly once. Never returned by any other endpoint,
            and never persist it client-side.
        expiresAt:
          type: string
          format: date-time
          description: 14 days after creation, clamped to a 90-day maximum.

    RequestSummary:
      type: object
      required: [id, title, status, uploaded, total, createdAt, expiresAt]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          maxLength: 200
        status:
          $ref: "#/components/schemas/ProgressStatus"
        uploaded:
          type: integer
          minimum: 0
          maximum: 10
        total:
          type: integer
          minimum: 1
          maximum: 10
        lastActivityAt:
          type: string
          format: date-time
          nullable: true
          description: Newest upload, or null when nothing has been uploaded.
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        revokedAt:
          type: string
          format: date-time
          nullable: true

    Document:
      type: object
      required: [id, originalName, mimeType, sizeBytes, uploadedAt]
      properties:
        id:
          type: string
          format: uuid
        originalName:
          type: string
          maxLength: 255
          description: Display only. Never used to build a path or a storage key.
        mimeType:
          type: string
          description: Sniffed from content, never taken from the request header.
        sizeBytes:
          type: integer
          minimum: 1
        uploadedAt:
          type: string
          format: date-time
        downloadUrl:
          type: string
          format: uri
          nullable: true
          description: |
            Presigned object-storage URL, valid for five minutes and served with
            `attachment` and `nosniff`. Null when the item has no document.

            Owner surface only, so this field never appears in `PortalView`: the portal
            has its own item schema that carries no URL, key, or `mimeType`.

    RequestItem:
      type: object
      description: Owner surface only. Carries the full document, including its download URL.
      required: [id, label, position, state]
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string
          maxLength: 200
          description: Owner-written text. Treat as untrusted input.
        position:
          type: integer
          minimum: 1
          maximum: 10
        state:
          $ref: "#/components/schemas/ItemState"
        document:
          oneOf:
            - $ref: "#/components/schemas/Document"
            - type: "null"

    RequestDetail:
      type: object
      required: [id, title, status, uploaded, total, createdAt, expiresAt, items]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          maxLength: 200
        status:
          $ref: "#/components/schemas/ProgressStatus"
        uploaded:
          type: integer
          minimum: 0
          maximum: 10
        total:
          type: integer
          minimum: 1
          maximum: 10
        lastActivityAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        revokedAt:
          type: string
          format: date-time
          nullable: true
        items:
          type: array
          minItems: 1
          maxItems: 10
          items:
            $ref: "#/components/schemas/RequestItem"

    CreatedRequest:
      type: object
      required: [request, link]
      properties:
        request:
          $ref: "#/components/schemas/RequestDetail"
        link:
          $ref: "#/components/schemas/MagicLink"

    RequestPage:
      type: object
      required: [data, nextCursor]
      properties:
        data:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/RequestSummary"
        nextCursor:
          type: string
          nullable: true
          description: Absent or null on the last page.

    PortalView:
      type: object
      required: [title, status, uploaded, total, lastActivityAt, expiresAt, items]
      properties:
        title:
          type: string
          maxLength: 200
          description: Owner-written text. Render as text, never as markup.
        status:
          $ref: "#/components/schemas/ProgressStatus"
        uploaded:
          type: integer
          minimum: 0
          maximum: 10
        total:
          type: integer
          minimum: 1
          maximum: 10
        lastActivityAt:
          type: string
          format: date-time
          nullable: true
          description: Newest upload on this request, or null when nothing has been uploaded.
        expiresAt:
          type: string
          format: date-time
          description: Shown to the client, since the link stops working at this moment.
        items:
          type: array
          minItems: 1
          maxItems: 10
          description: Every item, uploaded or not, so a client never infers a missing row.
          items:
            $ref: "#/components/schemas/PortalItem"

    PortalItem:
      type: object
      required: [id, label, position, state, file]
      description: |
        The client-visible item. It carries only what the client already knows: there is
        no `downloadUrl`, no storage key, no `mimeType`, and no owner identity anywhere in
        this surface.
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string
          maxLength: 200
          description: Owner-written text. Treat as untrusted input and insert it as a text node.
        position:
          type: integer
          minimum: 1
          maximum: 10
        state:
          $ref: "#/components/schemas/ItemState"
        file:
          description: What this client uploaded, or null while the item is waiting.
          oneOf:
            - type: object
              required: [originalName, sizeBytes, uploadedAt]
              properties:
                originalName:
                  type: string
                  maxLength: 255
                  description: Display only, never used to build a path or a key.
                sizeBytes:
                  type: integer
                  minimum: 1
                uploadedAt:
                  type: string
                  format: date-time
            - type: "null"