[www]
user = www-data
group = www-data

listen = 9000
listen.owner = www-data
listen.group = www-data
listen.backlog = 1024

pm = dynamic
pm.max_children = 16
pm.start_servers = 4
pm.min_spare_servers = 4
pm.max_spare_servers = 8
pm.status_path = /fpm-status
pm.max_requests = 500

clear_env = no
catch_workers_output = yes
decorate_workers_output = no
