services:
    api-http:
        image: nginx:stable-alpine
        ports:
            - "127.0.0.1:8000:80"
        volumes:
            - ./api/public:/var/www/html/public:ro
            - ./tests/load/nginx.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            api:
                condition: service_started
        restart: unless-stopped
