services:
    # Replace the development server with the production PHP-FPM image.
    api:
        command: ["php-fpm", "-F"]
        restart: "no"
        ports: !reset []
        volumes: !override
            - ./tests/load/php-fpm-www.conf:/usr/local/etc/php-fpm.d/www.conf:ro

    migrate:
        volumes: !reset []

    worker:
        volumes: !reset []

    scheduler:
        volumes: !reset []

    # Expose Laravel over HTTP while PHP-FPM remains private on the Compose network.
    api-http:
        image: nginx:stable-alpine
        ports:
            - "127.0.0.1:8000:80"
        volumes:
            - ./api/public:/var/www/html/public:ro
            - ./tests/load/nginx.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            api:
                condition: service_started
        restart: unless-stopped
