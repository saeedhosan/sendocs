# This file is included from nginx's http context via conf.d/*.conf.
# Magic links are bearer credentials, so never log their raw path segment.
map $request_uri $safe_request_uri {
    default $request_uri;
    ~^(/api/v1/portal/)[^/?]+(?:/[^?]*)?(?:\?.*)?$ "$1[REDACTED]";
    ~^(/portal/)[^/?]+(?:/[^?]*)?(?:\?.*)?$ "$1[REDACTED]";
    # Query strings can carry password-reset, email-verification, and OAuth credentials.
    ~^([^?]*)\?.*$ "$1?[REDACTED]";
}

# Keep a separate log for requests taking at least five seconds.
map $request_time $log_slow_request {
    default 0;
    ~^[5-9](?:\.[0-9]+)?$ 1;
    ~^[1-9][0-9]+(?:\.[0-9]+)?$ 1;
}

log_format sendocs_safe '$remote_addr - $remote_user [$time_local] "$request_method $safe_request_uri $server_protocol" '
                        '$status $body_bytes_sent "$http_user_agent" '
                        'request_time=$request_time upstream_response_time=$upstream_response_time';
