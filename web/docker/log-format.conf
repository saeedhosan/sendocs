# This file is included from nginx's http context via conf.d/*.conf.
# Magic links are bearer credentials, so never log their raw path segment.
map $request_uri $safe_request_uri {
    default $request_uri;
    ~^(/api/v1/portal/)[A-Za-z0-9_-]{43}((?:/items/[^/?]+/file)?/?(?:\\?.*)?)$ "$1[REDACTED]$2";
    ~^(/portal/)[A-Za-z0-9_-]{43}(/?(?:\\?.*)?)$ "$1[REDACTED]$2";
}

log_format sendocs_safe '$remote_addr - $remote_user [$time_local] "$request_method $safe_request_uri $server_protocol" '
                        '$status $body_bytes_sent "$http_user_agent"';
