server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    access_log /var/log/nginx/access.log sendocs_safe;

    # Resolve the Compose service at runtime; the API host does not exist during image builds.
    resolver 127.0.0.11 ipv6=off valid=10s;
    set $api_upstream api:9000;
    index index.html;

    client_max_body_size 27m;
    error_page 413 = @payload_too_large;

    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/javascript application/json image/svg+xml text/css;

    location = /health {
        include fastcgi_params;
        fastcgi_pass $api_upstream;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param HTTP_PROXY "";
    }

    location /api/ {
        include fastcgi_params;
        fastcgi_pass $api_upstream;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param HTTP_PROXY "";
        fastcgi_read_timeout 300s;
        fastcgi_buffer_size 32k;
        fastcgi_buffers 16 16k;
    }

    location @payload_too_large {
        default_type application/json;
        return 413 '{"error":{"code":"file_too_large","message":"The file is larger than 25 MB."}}';
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        # This location overrides server-level add_header inheritance.
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
