name: Stage deploy

on:
    workflow_dispatch:
    push:
        branches:
            - stage

permissions:
    contents: read

concurrency:
    group: deploy
    cancel-in-progress: true

jobs:
    deploy:
        runs-on: ubuntu-latest
        environment: stage
        timeout-minutes: 30

        env:
            SSH_KEY: ${{ secrets.SSH_KEY }}
            SSH_HOST: ${{ secrets.SSH_HOST }}
            SSH_USER: ${{ secrets.SSH_USER }}
            SSH_PATH: ${{ secrets.SSH_PATH }}
            SSH_PORT: ${{ secrets.SSH_PORT }}

        steps:
            - name: Check out repository
              uses: actions/checkout@v4

            - name: Set up Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.x

            - name: Cache Bun
              uses: actions/cache@v4
              with:
                  path: ~/.bun/install/cache
                  key: bun-${{ runner.os }}-${{ hashFiles('web/bun.lock') }}
                  restore-keys: |
                      bun-${{ runner.os }}-

            - name: Install web dependencies
              working-directory: web
              run: bun install --frozen-lockfile

            - name: Build web assets
              working-directory: web
              env:
                  VITE_API_URL: ${{ secrets.API_URL }}
              run: bun run build

            - name: Deploy to server (SCP)
              uses: appleboy/scp-action@v1.0.0
              with:
                  host: ${{ env.SSH_HOST }}
                  username: ${{ env.SSH_USER }}
                  key: ${{ env.SSH_KEY }}
                  port: ${{ env.SSH_PORT }}
                  source: "web/dist"
                  target: ${{ env.SSH_PATH }}/web
                  strip_components: 1
                  overwrite: true

            - name: Set up PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: "8.4"
                  extensions: bcmath, intl, mbstring, pcntl, pdo_sqlite, zip
                  tools: composer:v2
                  coverage: none
                  cache: composer
                  working-directory: api

            - name: Install API dependencies
              working-directory: api
              run: composer install --prefer-dist --no-dev --no-interaction --no-progress --optimize-autoloader

            - name: Deploy API to server (SCP)
              uses: appleboy/scp-action@v1.0.0
              with:
                  host: ${{ env.SSH_HOST }}
                  username: ${{ env.SSH_USER }}
                  key: ${{ env.SSH_KEY }}
                  port: ${{ env.SSH_PORT }}
                  source: "api/*,!api/.env"
                  target: ${{ env.SSH_PATH }}/api
                  strip_components: 1
                  overwrite: true

            - name: Run API post-deployment tasks
              uses: appleboy/ssh-action@v1.0.3
              with:
                  host: ${{ env.SSH_HOST }}
                  username: ${{ env.SSH_USER }}
                  key: ${{ env.SSH_KEY }}
                  port: ${{ env.SSH_PORT }}
                  script: |
                      set -e
                      cd "${{ env.SSH_PATH }}/api"

                      php artisan migrate --force
                      php artisan optimize:clear
                      php artisan config:cache
                      php artisan view:cache
