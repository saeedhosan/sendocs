name: Stage Deployment

on:
    workflow_dispatch:
    push:
        branches:
            - stage

permissions:
    contents: read

concurrency:
    group: deploy-stage
    cancel-in-progress: false

env:
    SSH_KEY: ${{ secrets.SSH_KEY }}
    SSH_HOST: ${{ secrets.SSH_HOST }}
    SSH_USER: ${{ secrets.SSH_USER }}
    SSH_PORT: ${{ secrets.SSH_PORT }}
    SSH_PATH: ${{ secrets.SSH_PATH }}
    WEB_PATH: ${{ secrets.WEB_PATH }}
    API_PATH: ${{ secrets.API_PATH }}

jobs:
    web-deployment:
        name: Web Deployment
        runs-on: ubuntu-latest
        timeout-minutes: 25
        environment: stage

        steps:
            - name: Check out repository
              uses: actions/checkout@v4

            - name: Set up Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.x

            - name: Cache Bun
              uses: actions/cache@v4
              with:
                  path: ~/.bun/install/cache
                  key: bun-${{ runner.os }}-${{ hashFiles('web/bun.lock') }}
                  restore-keys: |
                      bun-${{ runner.os }}-

            - name: Install web dependencies
              working-directory: web
              run: bun install --frozen-lockfile

            - name: Build web assets
              working-directory: web
              env:
                  VITE_API_URL: ${{ secrets.API_URL }}
              run: bun run build

            - name: Deploy web assets
              uses: appleboy/scp-action@v1.0.0
              with:
                  host: ${{ env.SSH_HOST }}
                  username: ${{ env.SSH_USER }}
                  key: ${{ env.SSH_KEY }}
                  port: ${{ env.SSH_PORT }}
                  source: "web/dist/*"
                  target: ${{ env.WEB_PATH }}
                  strip_components: 2
                  overwrite: true

    api-deployment:
        name: API Deployment
        runs-on: ubuntu-latest
        timeout-minutes: 25
        environment: stage
        needs: web-deployment

        steps:
            - name: Check out repository
              uses: actions/checkout@v4

            - name: Set up PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: "8.4"
                  extensions: bcmath, intl, mbstring, pcntl, pdo_pgsql, zip
                  tools: composer:v2
                  coverage: none

            - name: Install production dependencies
              working-directory: api
              run: composer install --prefer-dist --no-dev --no-interaction --no-progress --optimize-autoloader

            - name: Deploy API code
              uses: appleboy/scp-action@v1.0.0
              with:
                  host: ${{ env.SSH_HOST }}
                  username: ${{ env.SSH_USER }}
                  key: ${{ env.SSH_KEY }}
                  port: ${{ env.SSH_PORT }}
                  source: "api/*"
                  target: ${{ env.API_PATH }}
                  strip_components: 1
                  overwrite: true

            - name: Run post-deployment scripts
              uses: appleboy/ssh-action@v1.0.3
              with:
                  host: ${{ env.SSH_HOST }}
                  username: ${{ env.SSH_USER }}
                  key: ${{ env.SSH_KEY }}
                  port: ${{ env.SSH_PORT }}
                  script: |
                      set -e
                      cd "${{ env.API_PATH }}"

                      php artisan migrate --force
                      php artisan optimize:clear
                      php artisan config:cache
                      php artisan view:cache
