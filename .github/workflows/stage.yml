name: Stage Deployment

on:
    workflow_dispatch:
    push:
        branches:
            - stage

permissions:
    contents: read

concurrency:
    group: deploy-stage
    cancel-in-progress: true

env:
    API_URL: ${{ secrets.API_URL }}
    SSH_KEY: ${{ secrets.SSH_KEY }}
    SSH_HOST: ${{ secrets.SSH_HOST }}
    SSH_USER: ${{ secrets.SSH_USER }}
    SSH_PATH: ${{ secrets.SSH_PATH }}
    SSH_PORT: ${{ secrets.SSH_PORT }}

jobs:
    deploy:
        name: Deploy to Stage Server
        needs: test-and-build
        runs-on: ubuntu-latest
        timeout-minutes: 20
        environment: stage

        steps:
            - name: Download web build artifact
              uses: actions/download-artifact@v4
              with:
                  name: web-build
                  path: dist/

            - name: Debug web artifact
              run: ls -la dist/

            - name: Download API artifact
              uses: actions/download-artifact@v4
              with:
                  name: api-build
                  path: api-artifact/

            - name: Deploy web assets to server (SCP)
              uses: appleboy/scp-action@v1.0.0
              with:
                  host: ${{ env.SSH_HOST }}
                  username: ${{ env.SSH_USER }}
                  key: ${{ env.SSH_KEY }}
                  port: ${{ env.SSH_PORT }}
                  source: "dist/*"
                  target: ${{ env.SSH_PATH }}/web
                  strip_components: 1
                  overwrite: true

            - name: Deploy API code to server (SCP)
              uses: appleboy/scp-action@v1.0.0
              with:
                  host: ${{ env.SSH_HOST }}
                  username: ${{ env.SSH_USER }}
                  key: ${{ env.SSH_KEY }}
                  port: ${{ env.SSH_PORT }}
                  source: "api-artifact/api/*"
                  target: ${{ env.SSH_PATH }}/api
                  strip_components: 1
                  overwrite: true

            - name: Run post-deployment scripts
              uses: appleboy/ssh-action@v1.0.3
              with:
                  host: ${{ env.SSH_HOST }}
                  username: ${{ env.SSH_USER }}
                  key: ${{ env.SSH_KEY }}
                  port: ${{ env.SSH_PORT }}
                  script: |
                      set -e
                      cd ${{ env.SSH_PATH }}/api

                      ls -la

                      # Create .env if not exists
                      if [ ! -f .env ]; then
                        cp .env.example .env
                      fi

                      # Generate app key if not set
                      if ! grep -q "APP_KEY=base64:" .env; then
                        php artisan key:generate --force
                      fi

                      # Run migrations
                      php artisan migrate --force

                      # Run seeders (if any)
                      php artisan db:seed --force || true

                      # Clear and cache config
                      php artisan config:clear
                      php artisan config:cache
                      php artisan route:cache
                      php artisan view:cache

                      # Set permissions
                      chown -R www-data:www-data storage bootstrap/cache
                      chmod -R 775 storage bootstrap/cache

                      echo "Deployment completed successfully"
