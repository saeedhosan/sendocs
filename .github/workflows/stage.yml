name: Stage Deployment

on:
    workflow_dispatch:
    push:
        branches:
            - stage

permissions:
    contents: read

concurrency:
    group: deploy-stage
    cancel-in-progress: true

env:
    API_URL: ${{ secrets.API_URL }}
    SSH_KEY: ${{ secrets.SSH_KEY }}
    SSH_HOST: ${{ secrets.SSH_HOST }}
    SSH_USER: ${{ secrets.SSH_USER }}
    SSH_PATH: ${{ secrets.SSH_PATH }}
    SSH_PORT: ${{ secrets.SSH_PORT }}

jobs:
    build-and-deploy:
        name: Build & Deploy
        runs-on: ubuntu-latest
        timeout-minutes: 25
        environment: stage

        steps:
            - name: Check out repository
              uses: actions/checkout@v4

            # API: Setup PHP and install dependencies
            - name: Set up PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: "8.4"
                  extensions: bcmath, intl, mbstring, pcntl, pdo_pgsql, zip
                  tools: composer:v2
                  coverage: none
                  cache: composer
                  working-directory: api

            - name: Create API environment file
              working-directory: api
              run: cp .env.example .env

            - name: Install API dependencies
              working-directory: api
              run: composer install --prefer-dist --no-interaction --no-progress

            # Web: Setup Bun and install dependencies
            - name: Set up Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.x

            - name: Cache Bun
              uses: actions/cache@v4
              with:
                  path: ~/.bun/install/cache
                  key: bun-${{ runner.os }}-${{ hashFiles('web/bun.lock') }}
                  restore-keys: |
                      bun-${{ runner.os }}-

            - name: Install web dependencies
              working-directory: web
              run: bun install --frozen-lockfile

            - name: Build web assets
              working-directory: web
              env:
                  VITE_API_URL: ${{ secrets.API_URL }}
              run: bun run build

            - name: Install API production dependencies
              working-directory: api
              run: composer install --prefer-dist --no-dev --no-interaction --no-progress --optimize-autoloader

            # Deploy web assets directly from build output
            - name: Deploy web assets to server (SCP)
              uses: appleboy/scp-action@v1.0.0
              with:
                  host: ${{ env.SSH_HOST }}
                  username: ${{ env.SSH_USER }}
                  key: ${{ env.SSH_KEY }}
                  port: ${{ env.SSH_PORT }}
                  source: "web/dist/*"
                  target: ${{ env.SSH_PATH }}/web
                  strip_components: 2
                  overwrite: true

            # Deploy API code directly from repo (with vendor built above)
            - name: Deploy API code to server (SCP)
              uses: appleboy/scp-action@v1.0.0
              with:
                  host: ${{ env.SSH_HOST }}
                  username: ${{ env.SSH_USER }}
                  key: ${{ env.SSH_KEY }}
                  port: ${{ env.SSH_PORT }}
                  source: "api/*"
                  target: ${{ env.SSH_PATH }}/api
                  strip_components: 1
                  overwrite: true

            - name: Run post-deployment scripts
              uses: appleboy/ssh-action@v1.0.3
              with:
                  host: ${{ env.SSH_HOST }}
                  username: ${{ env.SSH_USER }}
                  key: ${{ env.SSH_KEY }}
                  port: ${{ env.SSH_PORT }}
                  script: |
                      set -e
                      cd ${{ env.SSH_PATH }}/api

                      ls -la

                      # Create .env if not exists
                      if [ ! -f .env ]; then
                        cp .env.example .env
                      fi

                      # Generate app key if not set
                      if ! grep -q "APP_KEY=base64:" .env; then
                        php artisan key:generate --force
                      fi

                      # Run migrations
                      php artisan migrate --force

                      # Run seeders (if any)
                      php artisan db:seed --force || true

                      # Clear and cache config
                      php artisan config:clear
                      php artisan config:cache
                      php artisan route:cache
                      php artisan view:cache

                      # Set permissions
                      chown -R www-data:www-data storage bootstrap/cache
                      chmod -R 775 storage bootstrap/cache

                      echo "Deployment completed successfully"