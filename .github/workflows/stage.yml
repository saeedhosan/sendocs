name: Deploy staging

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy tested main commit
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: stage

    env:
      API_URL: ${{ secrets.API_URL }}
      SSH_KEY: ${{ secrets.SSH_KEY }}
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      WEB_PATH: ${{ secrets.WEB_PATH }}
      API_PATH: ${{ secrets.API_PATH }}

    steps:
      - name: Check out tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Validate deployment secrets
        shell: bash
        run: |
          for name in API_URL SSH_KEY SSH_HOST SSH_USER SSH_PORT WEB_PATH API_PATH; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing required secret: $name"
              exit 1
            fi
          done

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: bcmath, intl, mbstring, pcntl, pdo_sqlite, zip
          tools: composer:v2
          coverage: none
          working-directory: api

      - name: Install production API dependencies
        working-directory: api
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.x

      - name: Install web dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Build web application
        working-directory: web
        env:
          VITE_API_URL: ${{ secrets.API_URL }}
        run: bun run build

      - name: Deploy API
        uses: appleboy/scp-action@v1.0.0
        with:
          key: ${{ env.SSH_KEY }}
          host: ${{ env.SSH_HOST }}
          port: ${{ env.SSH_PORT }}
          username: ${{ env.SSH_USER }}
          source: api
          target: ${{ env.API_PATH }}
          strip_components: 1
          overwrite: true

      - name: Run migrations and clear Laravel caches
        uses: appleboy/ssh-action@v1.2.5
        env:
          API_PATH: ${{ env.API_PATH }}
        with:
          key: ${{ env.SSH_KEY }}
          host: ${{ env.SSH_HOST }}
          port: ${{ env.SSH_PORT }}
          username: ${{ env.SSH_USER }}
          envs: API_PATH
          script: |
            set -eu
            cd "$API_PATH"
            php artisan migrate --force
            php artisan optimize:clear

      - name: Deploy web application
        uses: appleboy/scp-action@v1.0.0
        with:
          key: ${{ env.SSH_KEY }}
          host: ${{ env.SSH_HOST }}
          port: ${{ env.SSH_PORT }}
          username: ${{ env.SSH_USER }}
          source: web/dist
          target: ${{ env.WEB_PATH }}
          strip_components: 2
          overwrite: true

      - name: Verify deployed API
        env:
          API_URL: ${{ env.API_URL }}
        run: curl --fail --silent --show-error --retry 5 --retry-delay 2 --retry-connrefused "${API_URL%/}/up"
