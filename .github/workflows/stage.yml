name: Stage deploy

on:
    workflow_dispatch:
    push:
        branches:
            - stage

permissions:
    contents: read

concurrency:
    group: deploy
    cancel-in-progress: true

jobs:
    web:
        runs-on: ubuntu-latest
        environment: stage
        timeout-minutes: 30

        env:
            SSH_KEY: ${{ secrets.SSH_KEY }}
            SSH_HOST: ${{ secrets.SSH_HOST }}
            SSH_USER: ${{ secrets.SSH_USER }}
            SSH_PORT: ${{ secrets.SSH_PORT }}
            WEB_PATH: ${{ secrets.WEB_PATH }}

        steps:
            - name: Check out repository
              uses: actions/checkout@v4

            - name: Set up Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.x

            - name: Cache Bun
              uses: actions/cache@v4
              with:
                  path: ~/.bun/install/cache
                  key: bun-${{ runner.os }}-${{ hashFiles('web/bun.lock') }}
                  restore-keys: |
                      bun-${{ runner.os }}-

            - name: Install & Build UI
              working-directory: web
              env:
                  VITE_API_URL: ${{ secrets.API_URL }}
              run: |
                  bun install --frozen-lockfile
                  bun run build

            - name: Deploy to server (SCP)
              uses: appleboy/scp-action@v1.0.0
              with:
                  key: ${{ env.SSH_KEY }}
                  host: ${{ env.SSH_HOST }}
                  port: ${{ env.SSH_PORT }}
                  username: ${{ env.SSH_USER }}
                  source: "web/dist"
                  target: ${{ env.WEB_PATH }}
                  strip_components: 2
                  overwrite: true
