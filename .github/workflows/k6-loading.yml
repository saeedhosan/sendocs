name: Scalability Load Test

on:
    workflow_dispatch:
    pull_request:
        branches:
            - main

permissions:
    contents: read

concurrency:
    group: scalability-load-${{ github.ref }}
    cancel-in-progress: true

jobs:
    load_test:
        name: Docker Compose + k6 load test
        runs-on: ubuntu-latest
        timeout-minutes: 25

        steps:
            - name: Check out repository
              uses: actions/checkout@v7

            - name: Record runner and commit
              run: |
                  mkdir -p scalability-results
                  {
                    echo "commit=${GITHUB_SHA}"
                    echo "runner_os=${RUNNER_OS}"
                    echo "runner_arch=${RUNNER_ARCH}"
                    echo "cpu_count=$(nproc)"
                    grep MemTotal /proc/meminfo
                    docker version
                    docker compose version
                  } > scalability-results/environment.txt

            - name: Create Compose environment
              run: cp .env.example .env

            - name: Build Compose images
              run: docker compose build

            - name: Run migrations
              run: docker compose run --rm migrate

            - name: Start the complete Compose application stack
              # The test helper runs the full test suites, so exclude it from the load-test environment.
              run: docker compose up -d --scale test=0 --scale migrate=0

            - name: Wait for frontend-proxied API health
              run: |
                  for attempt in $(seq 1 60); do
                    if curl --fail --silent http://127.0.0.1:3000/health > /dev/null; then
                      exit 0
                    fi
                    sleep 2
                  done
                  docker compose ps
                  docker compose logs --no-color
                  exit 1

            - name: Capture baseline container resources
              run: |
                  {
                    echo "captured_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
                    docker stats --no-stream
                  } > scalability-results/docker-stats-before.txt

            - name: Set up k6
              uses: grafana/setup-k6-action@v1
              with:
                  k6-version: '0.57.0'

            - name: Run k6 owner and client journey test
              uses: grafana/run-k6-action@v1
              with:
                  path: ./tests/load/k6-load.js
                  flags: --summary-export=./scalability-results/k6-summary.json
                  cloud-run-locally: true
                  cloud-comment-on-pr: false
                  disable-analytics: true

            - name: Capture post-test container resources
              if: always()
              run: |
                  {
                    echo "captured_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
                    docker stats --no-stream
                  } > scalability-results/docker-stats-after.txt || true

            - name: Capture application logs on failure
              if: failure()
              run: docker compose logs --no-color > scalability-results/compose-failure.log 2>&1 || true

            - name: Upload benchmark artifacts
              if: always()
              uses: actions/upload-artifact@v6
              with:
                  name: scalability-load-${{ github.run_id }}
                  path: scalability-results/
                  if-no-files-found: warn
                  retention-days: 14

            - name: Stop Compose services
              if: always()
              run: docker compose down --volumes --remove-orphans
