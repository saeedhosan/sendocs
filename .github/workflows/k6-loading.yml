name: Scalability Load Test

on:
    workflow_dispatch:
    pull_request:
        branches:
            - main

permissions:
    contents: write

concurrency:
    group: scalability-load-${{ github.head_ref || github.ref }}
    cancel-in-progress: true

jobs:
    load_test:
        name: Docker Compose + k6 load test
        runs-on: ubuntu-latest
        timeout-minutes: 25
        env:
            BENCHMARK_SCENARIO: Progressive concurrent owner workload
            BENCHMARK_CONCURRENT_OWNER_TARGET: '1000'
            BENCHMARK_WORKLOAD: 1,000 owner VUs across home, auth session, and owner APIs; 10 login and registration requests; up to 60 portal reads and 30 uploads within shared-IP limits

        steps:
            - name: Check out repository
              uses: actions/checkout@v7
              with:
                  ref: ${{ github.head_ref || github.ref_name }}
                  persist-credentials: true

            - name: Record runner resources
              id: runner
              run: |
                  mkdir -p scalability-results
                  echo "cpu_count=$(nproc)" >> "$GITHUB_OUTPUT"
                  awk '/MemTotal/ {printf "memory_gb=%.1f\n", $2/1024/1024}' /proc/meminfo >> "$GITHUB_OUTPUT"

            - name: Create Compose environment
              run: cp .env.example .env

            - name: Build Compose images
              run: docker compose build

            - name: Run migrations
              run: docker compose run --rm migrate

            - name: Start the complete Compose application stack
              # The test helper runs the full test suites, so exclude it from the load-test environment.
              run: docker compose up -d --scale test=0 --scale migrate=0

            - name: Wait for frontend-proxied API health
              run: |
                  for attempt in $(seq 1 60); do
                    if curl --fail --silent http://127.0.0.1:3000/health > /dev/null; then
                      exit 0
                    fi
                    sleep 2
                  done
                  docker compose ps
                  docker compose logs --no-color
                  exit 1

            - name: Seed isolated synthetic owners and sessions
              run: docker compose exec -T api php tests/Load/seed-owners.php 1010 > scalability-results/owners.json

            - name: Set up k6
              uses: grafana/setup-k6-action@v1
              with:
                  k6-version: '0.57.0'

            - name: Run k6 progressive owner and endpoint workload
              uses: grafana/run-k6-action@v1
              env:
                  BASE_URL: http://127.0.0.1:3000
                  RUNNER_OS: ${{ runner.os }}
                  RUNNER_ARCH: ${{ runner.arch }}
                  RUNNER_CPU_COUNT: ${{ steps.runner.outputs.cpu_count }}
                  RUNNER_MEMORY_GB: ${{ steps.runner.outputs.memory_gb }}
              with:
                  path: ./tests/load/k6-load.js
                  flags: --summary-export=./scalability-results/k6-summary.json
                  cloud-run-locally: true
                  cloud-comment-on-pr: false
                  disable-analytics: true

            - name: Remove temporary synthetic credentials
              if: always()
              run: rm -f scalability-results/owners.json

            - name: Append result to benchmark history
              if: always() && hashFiles('scalability-results/benchmark-entry.md') != ''
              run: |
                  marker="$(head -n 1 scalability-results/benchmark-entry.md)"
                  if ! grep --fixed-strings --line-regexp --quiet "$marker" docs/benchmark.md; then
                    printf '\n' >> docs/benchmark.md
                    cat scalability-results/benchmark-entry.md >> docs/benchmark.md
                  fi

            - name: Commit benchmark result
              if: always() && hashFiles('scalability-results/benchmark-entry.md') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
              uses: stefanzweifel/git-auto-commit-action@v7
              with:
                  branch: ${{ github.head_ref || github.ref_name }}
                  file_pattern: docs/benchmark.md
                  commit_message: "docs: record benchmark result"

            - name: Capture application logs on failure
              if: failure()
              run: docker compose logs --no-color > scalability-results/compose-failure.log 2>&1 || true

            - name: Upload supporting benchmark artifacts
              if: always()
              uses: actions/upload-artifact@v6
              with:
                  name: scalability-load-${{ github.run_id }}
                  path: |
                      scalability-results/benchmark-entry.md
                      scalability-results/k6-summary.json
                      scalability-results/compose-failure.log
                  if-no-files-found: warn
                  retention-days: 14

            - name: Stop Compose services
              if: always()
              run: docker compose down --volumes --remove-orphans
