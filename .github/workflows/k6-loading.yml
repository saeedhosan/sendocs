name: Scalability Load Test

on:
    workflow_dispatch:
        inputs:
            target_vus:
                description: "Concurrent HTTP virtual users per workload group"
                type: string
                default: "100"
                required: true
            test_duration:
                description: "Duration per workload group (for example 60s or 5m)."
                type: string
                default: "60s"
                required: true
    pull_request:
        branches:
            - main
    #     paths-ignore:
    #         - docs/benchmark.md

permissions:
    contents: write

concurrency:
    group: scalability-load-${{ github.head_ref || github.ref }}
    cancel-in-progress: true

jobs:
    load_test:
        name: HTTP load - ${{ matrix.group }}
        runs-on: ubuntu-latest
        timeout-minutes: 30
        strategy:
            fail-fast: false
            matrix:
                group: [landing, auth, owner, client]

        steps:
            - name: Check out repository
              uses: actions/checkout@v7
              with:
                  ref: ${{ github.head_ref || github.ref_name }}
                  persist-credentials: true

            - name: Create Compose environment
              run: |
                  cp .env.example .env
                  sed -i 's/^APP_ENV=.*/APP_ENV=testing/' .env

            - name: Build Compose images
              run: docker compose build

            - name: Run migrations
              run: docker compose run --rm migrate

            - name: Start the application stack
              run: docker compose up -d --scale test=0 --scale migrate=0

            - name: Wait for application health
              run: |
                  for attempt in $(seq 1 60); do
                    if curl --fail --silent http://127.0.0.1:3000/health > /dev/null; then
                      exit 0
                    fi
                    sleep 2
                  done
                  docker compose ps
                  docker compose logs --no-color
                  exit 1

            - name: Set up k6
              uses: grafana/setup-k6-action@v1
              with:
                  k6-version: '0.57.0'

            - name: Start resource monitor
              run: |
                  mkdir -p scalability-results
                  (
                    while true; do
                      echo "===== $(date -u '+%Y-%m-%dT%H:%M:%SZ') ====="
                      echo "--- Host memory ---"
                      free -h
                      echo "--- Host load average ---"
                      cat /proc/loadavg
                      echo "--- Top host processes ---"
                      ps -eo pid,comm,%cpu,%mem,rss --sort=-%cpu | head -n 12
                      echo "--- Docker container usage ---"
                      docker stats --no-stream --format "table {{.Name}}\t{{.CPUPerc}}\t{{.MemUsage}}\t{{.MemPerc}}"
                      sleep 5
                    done
                  ) >> scalability-results/resource-usage-${{ matrix.group }}.log 2>&1 &
                  echo $! > scalability-results/resource-monitor.pid

            - name: Run HTTP load test
              env:
                  BASE_URL: http://127.0.0.1:3000
                  TARGET_VUS: ${{ github.event_name == 'workflow_dispatch' && inputs.target_vus || '100' }}
                  TEST_DURATION: ${{ github.event_name == 'workflow_dispatch' && inputs.test_duration || '60s' }}
                  WORKLOAD_GROUP: ${{ matrix.group }}
              run: |
                  mkdir -p scalability-results
                  k6 run ./tests/load/k6-load.js

            - name: Stop resource monitor
              if: always()
              run: |
                  if [ -f scalability-results/resource-monitor.pid ]; then
                    kill "$(cat scalability-results/resource-monitor.pid)" 2>/dev/null || true
                  fi

            - name: Capture application logs on failure
              if: failure()
              run: |
                  docker compose logs --no-color > scalability-results/compose-failure-${{ matrix.group }}.log 2>&1 || true

            - name: Upload workload artifacts
              if: always()
              uses: actions/upload-artifact@v6
              with:
                  name: http-scalability-${{ github.run_id }}-${{ matrix.group }}
                  path: |
                      scalability-results/benchmark-entry-${{ matrix.group }}.md
                      scalability-results/k6-summary-${{ matrix.group }}.json
                      scalability-results/resource-usage-${{ matrix.group }}.log
                      scalability-results/compose-failure-${{ matrix.group }}.log
                  if-no-files-found: warn
                  retention-days: 1

            - name: Stop Compose services
              if: always()
              run: docker compose down --volumes --remove-orphans

    record_results:
        name: Aggregate benchmark results
        if: always()
        needs: [load_test]
        runs-on: ubuntu-latest
        steps:
            - name: Check out reports branch
              uses: actions/checkout@v7
              with:
                  ref: reports
                  persist-credentials: true

            - name: Download workload artifacts
              continue-on-error: true
              uses: actions/download-artifact@v6
              with:
                  pattern: http-scalability-${{ github.run_id }}-*
                  path: scalability-results
                  merge-multiple: true

            - name: Append workload results to benchmark history
              run: |
                  shopt -s nullglob
                  reports=(scalability-results/benchmark-entry-*.md)
                  if [ "${#reports[@]}" -eq 0 ]; then
                    echo "No benchmark reports were produced."
                    exit 0
                  fi

                  run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
                  if ! grep --fixed-strings --quiet "$run_url" docs/benchmark.md; then
                    printf '\n' >> docs/benchmark.md
                    for report in "${reports[@]}"; do
                      cat "$report" >> docs/benchmark.md
                    done
                  fi

            - name: Commit benchmark results
              if: always() && hashFiles('scalability-results/benchmark-entry-*.md') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
              uses: stefanzweifel/git-auto-commit-action@v7
              with:
                  branch: reports
                  file_pattern: docs/benchmark.md
                  commit_message: "docs: record parallel HTTP load benchmark"
