name: Scalability Load Test

on:
    workflow_dispatch:
    pull_request:
        branches:
            - main

permissions:
    contents: write

concurrency:
    group: scalability-load-${{ github.head_ref || github.ref }}
    cancel-in-progress: true

jobs:
    load_test:
        name: Docker Compose + k6 load test
        runs-on: ubuntu-latest
        timeout-minutes: 25
        env:
            BENCHMARK_SCENARIO: Functional baseline
            BENCHMARK_DAU_TARGET: Not tested
            BENCHMARK_WORKLOAD: 1 owner completing one request and one client upload

        steps:
            - name: Check out repository
              uses: actions/checkout@v7

            - name: Record runner resources
              id: runner
              run: |
                  mkdir -p scalability-results
                  echo "cpu_count=$(nproc)" >> "$GITHUB_OUTPUT"
                  awk '/MemTotal/ {printf "memory_gb=%.1f\n", $2/1024/1024}' /proc/meminfo >> "$GITHUB_OUTPUT"

            - name: Create Compose environment
              run: cp .env.example .env

            - name: Build Compose images
              run: docker compose build

            - name: Run migrations
              run: docker compose run --rm migrate

            - name: Start the complete Compose application stack
              # The test helper runs the full test suites, so exclude it from the load-test environment.
              run: docker compose up -d --scale test=0 --scale migrate=0

            - name: Wait for frontend-proxied API health
              run: |
                  for attempt in $(seq 1 60); do
                    if curl --fail --silent http://127.0.0.1:3000/health > /dev/null; then
                      exit 0
                    fi
                    sleep 2
                  done
                  docker compose ps
                  docker compose logs --no-color
                  exit 1

            - name: Set up k6
              uses: grafana/setup-k6-action@v1
              with:
                  k6-version: '0.57.0'

            - name: Run k6 owner and client journey test
              uses: grafana/run-k6-action@v1
              env:
                  RUNNER_CPU_COUNT: ${{ steps.runner.outputs.cpu_count }}
                  RUNNER_MEMORY_GB: ${{ steps.runner.outputs.memory_gb }}
              with:
                  path: ./tests/load/k6-load.js
                  flags: --summary-export=./scalability-results/k6-summary.json
                  cloud-run-locally: true
                  cloud-comment-on-pr: false
                  disable-analytics: true

            - name: Publish result to docs/benchmark.md
              if: always() && hashFiles('scalability-results/benchmark-entry.md') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
              env:
                  TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git fetch origin "${TARGET_BRANCH}"
                  git checkout -B "${TARGET_BRANCH}" "origin/${TARGET_BRANCH}"

                  marker="<!-- benchmark-run: ${GITHUB_RUN_ID} -->"
                  if ! grep -Fq "${marker}" docs/benchmark.md; then
                    printf '\n\n' >> docs/benchmark.md
                    cat scalability-results/benchmark-entry.md >> docs/benchmark.md
                  fi

                  git add docs/benchmark.md
                  if git diff --cached --quiet; then
                    echo "No benchmark document changes."
                    exit 0
                  fi
                  git commit -m "docs: record benchmark result"
                  git push origin "HEAD:${TARGET_BRANCH}"

            - name: Capture application logs on failure
              if: failure()
              run: docker compose logs --no-color > scalability-results/compose-failure.log 2>&1 || true

            - name: Upload supporting benchmark artifacts
              if: always()
              uses: actions/upload-artifact@v6
              with:
                  name: scalability-load-${{ github.run_id }}
                  path: |
                      scalability-results/benchmark-entry.md
                      scalability-results/k6-summary.json
                      scalability-results/compose-failure.log
                  if-no-files-found: warn
                  retention-days: 14

            - name: Stop Compose services
              if: always()
              run: docker compose down --volumes --remove-orphans
