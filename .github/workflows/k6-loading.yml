name: Scalability Load Test

on:
    workflow_dispatch:
        inputs:
            target_vus:
                description: "Concurrent HTTP virtual users"
                type: string
                default: "500"
                required: true
            test_duration:
                description: "Load test duration (for example: 60s, 5m)"
                type: string
                default: "0"
                required: true
    pull_request:
        branches:
            - main
        paths-ignore:
            - docs/benchmark.md

permissions:
    contents: write

concurrency:
    group: scalability-load-${{ github.head_ref || github.ref }}
    cancel-in-progress: true

jobs:
    load_test:
        name: Docker Compose + HTTP load test
        runs-on: ubuntu-latest
        timeout-minutes: 30

        steps:
            - name: Check out repository
              uses: actions/checkout@v7
              with:
                  ref: ${{ github.head_ref || github.ref_name }}
                  persist-credentials: true

            - name: Create Compose environment
              run: cp .env.example .env

            - name: Build Compose images
              run: docker compose build

            - name: Run migrations
              run: docker compose run --rm migrate

            - name: Start the application stack
              run: docker compose up -d --scale test=0 --scale migrate=0

            - name: Wait for application health
              run: |
                  for attempt in $(seq 1 60); do
                    if curl --fail --silent http://127.0.0.1:3000/health > /dev/null; then
                      exit 0
                    fi
                    sleep 2
                  done
                  docker compose ps
                  docker compose logs --no-color
                  exit 1

            - name: Set up k6
              uses: grafana/setup-k6-action@v1
              with:
                  k6-version: '0.57.0'

            - name: Start resource monitor
              run: |
                  mkdir -p scalability-results
                  (
                    while true; do
                      echo "===== $(date -u '+%Y-%m-%dT%H:%M:%SZ') ====="
                      echo "--- Host memory ---"
                      free -h
                      echo "--- Host load average ---"
                      cat /proc/loadavg
                      echo "--- Top host processes ---"
                      ps -eo pid,comm,%cpu,%mem,rss --sort=-%cpu | head -n 12
                      echo "--- Docker container usage ---"
                      docker stats --no-stream --format "table {{.Name}}\t{{.CPUPerc}}\t{{.MemUsage}}\t{{.MemPerc}}"
                      sleep 5
                    done
                  ) >> scalability-results/resource-usage.log 2>&1 &
                  echo $! > scalability-results/resource-monitor.pid

            - name: Run HTTP load test
              env:
                  BASE_URL: http://127.0.0.1:3000
                  TARGET_VUS: ${{ github.event_name == 'workflow_dispatch' && inputs.target_vus || '1000' }}
                  TEST_DURATION: ${{ github.event_name == 'workflow_dispatch' && inputs.test_duration || '60s' }}
              run: |
                  mkdir -p scalability-results
                  k6 run --summary-export=./scalability-results/k6-summary.json ./tests/load/k6-load.js

            - name: Stop resource monitor
              if: always()
              run: |
                  if [ -f scalability-results/resource-monitor.pid ]; then
                    kill "$(cat scalability-results/resource-monitor.pid)" 2>/dev/null || true
                  fi

            - name: Append result to benchmark history
              if: always() && hashFiles('scalability-results/benchmark-entry.md') != ''
              run: |
                  run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
                  if ! grep --fixed-strings --quiet "$run_url" docs/benchmark.md; then
                    printf '\\n' >> docs/benchmark.md
                    cat scalability-results/benchmark-entry.md >> docs/benchmark.md
                  fi

            - name: Commit benchmark result
              if: always() && hashFiles('scalability-results/benchmark-entry.md') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
              uses: stefanzweifel/git-auto-commit-action@v7
              with:
                  branch: ${{ github.head_ref || github.ref_name }}
                  file_pattern: docs/benchmark.md
                  commit_message: "docs: record HTTP load benchmark"

            - name: Capture application logs on failure
              if: failure()
              run: docker compose logs --no-color > scalability-results/compose-failure.log 2>&1 || true

            - name: Upload benchmark artifacts
              if: always()
              uses: actions/upload-artifact@v6
              with:
                  name: http-scalability-${{ github.run_id }}
                  path: |
                      scalability-results/benchmark-entry.md
                      scalability-results/k6-summary.json
                      scalability-results/resource-usage.log
                      scalability-results/compose-failure.log
                  if-no-files-found: warn
                  retention-days: 1

            - name: Stop Compose services
              if: always()
              run: docker compose down --volumes --remove-orphans
