name: Linter

on:
    workflow_dispatch:

permissions:
    contents: write

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    api:
        name: API
        runs-on: ubuntu-latest
        timeout-minutes: 15

        steps:
            - name: Check out repository
              uses: actions/checkout@v4

            - name: Set up PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: "8.4"
                  extensions: bcmath, intl, mbstring, pcntl, pdo_sqlite, zip
                  tools: composer:v2
                  coverage: none
                  cache: composer
                  working-directory: api

            - name: Install dependencies
              working-directory: api
              run: composer install --prefer-dist --no-interaction --no-progress

            - name: Lint
              working-directory: api
              run: composer lint

            - name: Commit Changes
              uses: stefanzweifel/git-auto-commit-action@v7
              with:
                  commit_message: "style(api): apply lint fixes"
                  file_pattern: "api/**"

    web:
        name: Web
        runs-on: ubuntu-latest
        timeout-minutes: 10

        steps:
            - name: Check out repository
              uses: actions/checkout@v4

            - name: Set up Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.x

            - name: Install dependencies
              working-directory: web
              run: bun install --frozen-lockfile

            - name: Lint
              working-directory: web
              run: bun run lint

            - name: Commit Changes
              uses: stefanzweifel/git-auto-commit-action@v7
              with:
                  commit_message: "style(web): apply lint fixes"
                  file_pattern: "web/**"
