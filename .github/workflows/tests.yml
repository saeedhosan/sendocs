name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create the environment file
        run: cp .env.example .env

      - name: Build images
        run: npm run build

      - name: Verify migrations apply
        run: npm run migrate

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test