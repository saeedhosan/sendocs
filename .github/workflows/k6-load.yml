name: K6 Load Test

on:
    workflow_dispatch:
        inputs:
            target_vus:
                description: "Concurrent HTTP virtual users per workload group"
                type: string
                default: "500"
                required: true
            test_duration:
                description: "Duration per workload group (for example 60s or 5m)."
                type: string
                default: "60s"
                required: true
            target_base_url:
                description: "Optional HTTPS URL for an application running on a separate host. Leave empty to build the app on this runner."
                type: string
                default: ""
                required: false
    # pull_request:
    #     branches:
    #         - main

permissions:
    contents: write

concurrency:
    group: scale-load-${{ github.head_ref || github.ref }}
    cancel-in-progress: true

jobs:
    load_test:
        name: HTTP load - ${{ matrix.group }}
        runs-on: ubuntu-latest
        timeout-minutes: 30
        env:
            # Exercise the production Nginx + PHP-FPM runtime, not the dev servers.
            API_TARGET: prod
            WEB_TARGET: prod
        strategy:
            fail-fast: false
            matrix:
                group: [landing, auth, owner, client]

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7
              with:
                  ref: ${{ github.head_ref || github.ref_name }}
                  persist-credentials: true

            - name: Select benchmark target
              shell: bash
              env:
                  TARGET_BASE_URL_INPUT: ${{ inputs.target_base_url }}
              run: |
                  set -euo pipefail
                  mkdir -p test_results

                  if [ -n "$TARGET_BASE_URL_INPUT" ]; then
                      case "$TARGET_BASE_URL_INPUT" in
                          https://*) ;;
                          *)
                              echo "An external benchmark target must use HTTPS." >&2
                              exit 1
                              ;;
                      esac
                      target_url="$TARGET_BASE_URL_INPUT"
                      target_mode="external"
                  else
                      target_url="http://127.0.0.1:3000"
                      target_mode="local"
                  fi

                  while [ "$target_url" != "${target_url%/}" ]; do
                      target_url="${target_url%/}"
                  done

                  echo "TARGET_BASE_URL=$target_url" >> "$GITHUB_ENV"
                  echo "Benchmark target mode: $target_mode"
                  echo "Benchmark target host: $(printf '%s' "$target_url" | sed -E 's#https?://([^/]+).*#\\1#')"

            - name: Create Compose environment
              if: inputs.target_base_url == ''
              run: |
                  cp .env.example .env
                  sed -i 's/^APP_ENV=.*/APP_ENV=testing/' .env

            - name: Build production Compose images
              if: inputs.target_base_url == ''
              run: docker compose build

            - name: Run migrations
              if: inputs.target_base_url == ''
              run: docker compose run --rm migrate

            - name: Start the production application stack
              if: inputs.target_base_url == ''
              run: docker compose up -d --scale test=0 --scale migrate=0

            - name: Health check
              run: curl -fsS --retry 10 --retry-all-errors --retry-delay 2 --retry-connrefused "$TARGET_BASE_URL/health"

            - name: Set up k6
              uses: grafana/setup-k6-action@v1
              with:
                  k6-version: '0.57.0'

            - name: Start resource monitor
              run: |
                  (
                    while true; do
                      echo "===== $(date -u '+%Y-%m-%dT%H:%M:%SZ') ====="
                      echo "--- Load-generator host memory ---"
                      free -h
                      echo "--- Load-generator host load average ---"
                      cat /proc/loadavg
                      echo "--- Top load-generator host processes ---"
                      ps -eo pid,comm,%cpu,%mem,rss --sort=-%cpu | head -n 12
                      sleep 5
                    done
                  ) >> test_results/resource-usage-${{ matrix.group }}.log 2>&1 &
                  echo $! > test_results/resource-monitor.pid

            - name: Capture runner metadata
              uses: ./.github/actions/runner-metadata

            - name: Run HTTP load test
              env:
                  BASE_URL: ${{ env.TARGET_BASE_URL }}
                  TARGET_VUS: ${{ github.event_name == 'workflow_dispatch' && inputs.target_vus || '500' }}
                  TEST_DURATION: ${{ github.event_name == 'workflow_dispatch' && inputs.test_duration || '60s' }}
                  WORKLOAD_GROUP: ${{ matrix.group }}
              run: |
                  k6 run ./tests/load/k6-load.js

            - name: Stop resource monitor
              if: always()
              run: |
                  if [ -f test_results/resource-monitor.pid ]; then
                    kill "$(cat test_results/resource-monitor.pid)" 2>/dev/null || true
                  fi

            - name: Capture application logs on failure
              if: failure() && inputs.target_base_url == ''
              run: |
                  docker compose logs --no-color > test_results/compose-failure-${{ matrix.group }}.log 2>&1 || true

            - name: Upload workload artifacts
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: http-scalability-${{ github.run_id }}-${{ matrix.group }}
                  path: |
                      test_results/benchmark-entry-${{ matrix.group }}.md
                      test_results/k6-summary-${{ matrix.group }}.json
                      test_results/resource-usage-${{ matrix.group }}.log
                      test_results/compose-failure-${{ matrix.group }}.log
                  if-no-files-found: warn
                  retention-days: 1

            - name: Stop Compose services
              if: always() && inputs.target_base_url == ''
              run: docker compose down --volumes --remove-orphans

    record_results:
        name: Benchmark results
        if: always()
        needs: [load_test]
        runs-on: ubuntu-latest
        steps:
            - name: Checkout current branch
              uses: actions/checkout@v7
              with:
                  ref: ${{ github.head_ref || github.ref_name }}
                  persist-credentials: false

            - name: Download workload artifacts
              continue-on-error: true
              uses: actions/download-artifact@v8
              with:
                  pattern: http-scalability-${{ github.run_id }}-*
                  path: test_results
                  merge-multiple: true

            - name: Write performance summary
              if: always()
              uses: ./.github/actions/benchmark-summary

            - name: Append result to performance history
              id: append
              if: always()
              uses: ./.github/actions/append-benchmark

            - name: Checkout reports branch
              if: always()
              uses: actions/checkout@v7
              with:
                  ref: reports
                  persist-credentials: true

            - name: Apply performance history
              if: always() && steps.append.outputs.appended == 'true'
              run: cp "${{ steps.append.outputs.prepared-history }}" docs/performance.md

            - name: Commit performance metrics
              if: always() && steps.append.outputs.appended == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
              uses: stefanzweifel/git-auto-commit-action@v7
              with:
                  branch: reports
                  file_pattern: docs/performance.md
                  commit_message: "docs: record performance metrics"
