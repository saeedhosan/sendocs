name: K6 Load Test

on:
    workflow_dispatch:
        inputs:
            target_vus:
                description: "Concurrent virtual users for each isolated workload"
                type: string
                default: "3000"
                required: true
            test_duration:
                description: "Time to hold the target VU count (e.g 60s, 30m)."
                type: string
                default: "30m"
                required: true
    pull_request:
        branches:
            - main

permissions:
    contents: write

# concurrency:
#     group: scale-load-${{ github.head_ref || github.ref }}
#     cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
    load_test:
        name: HTTP load - ${{ matrix.group }}
        runs-on: ubuntu-latest
        timeout-minutes: 90
        env:
            APP_ENV: testing
            API_TARGET: prod
            WEB_TARGET: prod
            TARGET_VUS: ${{ github.event_name == 'workflow_dispatch' && inputs.target_vus || '3000' }}
            TEST_DURATION: ${{ github.event_name == 'workflow_dispatch' && inputs.test_duration || '30m' }}
        strategy:
            fail-fast: false
            matrix:
                group: [landing, auth, owner, client]

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7
              with:
                  ref: ${{ github.head_ref || github.ref_name }}
                  persist-credentials: true

            - name: Create environment
              run: |
                  cp .env.example .env
                  mkdir -p test_results

            - name: Build production Compose images
              run: docker compose build

            - name: Run migrations
              run: docker compose run --rm migrate

            - name: Start the production application stack
              run: docker compose up -d --scale test=0 --scale migrate=0

            - name: Health check
              run: curl -fsS --retry 10 --retry-all-errors --retry-delay 2 --retry-connrefused "http://127.0.0.1:3000/health"

            - name: Set up k6
              uses: grafana/setup-k6-action@v1
              with:
                  k6-version: '0.57.0'

            - name: Start resource monitor
              run: |
                  mkdir -p test_results
                  (
                    while true; do
                      echo "===== $(date -u '+%Y-%m-%dT%H:%M:%SZ') ====="
                      echo "--- Host memory ---"
                      free -h
                      echo "--- Host load average ---"
                      cat /proc/loadavg
                      echo "--- Top host processes ---"
                      ps -eo pid,comm,%cpu,%mem,rss --sort=-%cpu | head -n 12
                      echo "--- Docker container usage ---"
                      docker stats --no-stream --format "table {{.Name}}\\t{{.CPUPerc}}\\t{{.MemUsage}}\\t{{.MemPerc}}"
                      sleep 5
                    done
                  ) >> test_results/resource-usage-${{ matrix.group }}.log 2>&1 &
                  echo $! > test_results/resource-monitor.pid

            - name: Capture runner metadata
              uses: ./.github/actions/runner-metadata

            - name: Prepare workload accounts
              if: matrix.group != 'landing'
              env:
                  BASE_URL: http://127.0.0.1:3000
                  TARGET_VUS: ${{ env.TARGET_VUS }}
                  WORKLOAD_GROUP: ${{ matrix.group }}
              run: node ./tests/load/prepare-accounts.mjs

            - name: Run HTTP load test
              env:
                  BASE_URL: http://127.0.0.1:3000
                  TARGET_VUS: ${{ env.TARGET_VUS }}
                  TEST_DURATION: ${{ env.TEST_DURATION }}
                  WORKLOAD_GROUP: ${{ matrix.group }}
              run: |
                  mkdir -p test_results
                  k6 run ./tests/load/k6-load.js

            - name: Stop resource monitor
              if: always()
              run: |
                  if [ -f test_results/resource-monitor.pid ]; then
                    kill "$(cat test_results/resource-monitor.pid)" 2>/dev/null || true
                  fi

            - name: Capture application logs on failure
              if: failure()
              run: |
                  docker compose logs --no-color > test_results/compose-failure-${{ matrix.group }}.log 2>&1 || true

            - name: Capture Laravel logs on failure
              if: failure()
              run: |
                  docker compose exec -T api sh -lc '
                    for file in storage/logs/*.log; do
                      [ -f "$file" ] || continue
                      printf "\\n===== %s =====\\n" "$file"
                      cat "$file"
                    done
                  ' > test_results/laravel-failure-${{ matrix.group }}.log 2>&1 || true

            - name: Upload workload artifacts
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: http-scalability-${{ github.run_id }}-${{ matrix.group }}
                  path: |
                      test_results/benchmark-entry-${{ matrix.group }}.md
                      test_results/k6-summary-${{ matrix.group }}.json
                      test_results/resource-usage-${{ matrix.group }}.log
                      test_results/compose-failure-${{ matrix.group }}.log
                      test_results/laravel-failure-${{ matrix.group }}.log
                  if-no-files-found: warn
                  retention-days: 1

            - name: Stop Compose services
              if: always()
              run: docker compose down --volumes --remove-orphans

    record_results:
        name: Benchmark results
        if: always()
        needs: [load_test]
        runs-on: ubuntu-latest
        steps:
            - name: Checkout current branch
              uses: actions/checkout@v7
              with:
                  ref: ${{ github.head_ref || github.ref_name }}
                  persist-credentials: false

            - name: Download workload artifacts
              continue-on-error: true
              uses: actions/download-artifact@v8
              with:
                  pattern: http-scalability-${{ github.run_id }}-*
                  path: test_results
                  merge-multiple: true

            - name: Write performance summary
              if: always()
              uses: ./.github/actions/benchmark-summary

            - name: Append result to performance history
              id: append
              if: always()
              uses: ./.github/actions/append-benchmark

            - name: Checkout reports branch
              if: always()
              uses: actions/checkout@v7
              with:
                  ref: reports
                  persist-credentials: true

            - name: Apply performance history
              if: always() && steps.append.outputs.appended == 'true'
              run: cp "${{ steps.append.outputs.prepared-history }}" docs/performance.md

            - name: Commit performance metrics
              if: always() && steps.append.outputs.appended == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
              uses: stefanzweifel/git-auto-commit-action@v7
              with:
                  branch: reports
                  file_pattern: docs/performance.md
                  commit_message: "docs: record performance metrics"
