name: CI

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    api:
        name: API
        runs-on: ubuntu-latest
        timeout-minutes: 15
        services:
            rustfs:
                image: rustfs/rustfs:1.0.1
                ports:
                    - 9000:9000
                env:
                    RUSTFS_ACCESS_KEY: sendocs-local-access
                    RUSTFS_SECRET_KEY: local-only-change-this-secret
                    RUSTFS_ADDRESS: 0.0.0.0:9000
                    RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
                    RUSTFS_VOLUMES: /data

        steps:
            - name: Check out repository
              uses: actions/checkout@v4

            - name: Set up PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: "8.4"
                  extensions: bcmath, intl, mbstring, pcntl, pdo_sqlite, zip
                  tools: composer:v2
                  coverage: none
                  cache: composer
                  working-directory: api

            - name: Create environment file
              working-directory: api
              run: cp .env.example .env

            - name: Install dependencies
              working-directory: api
              run: composer install --prefer-dist --no-interaction --no-progress

            - name: Test
              working-directory: api
              run: composer test

            - name: Wait for RustFS and create the private bucket
              env:
                  AWS_ACCESS_KEY_ID: sendocs-local-access
                  AWS_SECRET_ACCESS_KEY: local-only-change-this-secret
                  AWS_DEFAULT_REGION: us-east-1
                  AWS_EC2_METADATA_DISABLED: "true"
              run: |
                  attempt=0
                  until aws --endpoint-url http://127.0.0.1:9000 s3api list-buckets >/dev/null 2>&1; do
                    attempt=$((attempt + 1))
                    if [ "$attempt" -ge 60 ]; then
                      echo "RustFS did not become ready" >&2
                      exit 1
                    fi
                    sleep 2
                  done
                  aws --endpoint-url http://127.0.0.1:9000 s3api create-bucket --bucket sendocs-private

            - name: Test S3-compatible storage
              working-directory: api
              env:
                  OBJECT_STORAGE_INTEGRATION: "true"
                  FILESYSTEM_DISK: s3
                  AWS_ACCESS_KEY_ID: sendocs-local-access
                  AWS_SECRET_ACCESS_KEY: local-only-change-this-secret
                  AWS_DEFAULT_REGION: us-east-1
                  AWS_BUCKET: sendocs-private
                  AWS_ENDPOINT: http://127.0.0.1:9000
                  AWS_USE_PATH_STYLE_ENDPOINT: "true"
              run: vendor/bin/pest tests/Feature/Storage/S3CompatibleStorageTest.php

    web:
        name: Web
        runs-on: ubuntu-latest
        timeout-minutes: 10

        steps:
            - name: Check out repository
              uses: actions/checkout@v4

            - name: Set up Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.x

            - name: Cache Bun
              uses: actions/cache@v4
              with:
                  path: ~/.bun/install/cache
                  key: bun-${{ runner.os }}-${{ hashFiles('web/bun.lock') }}
                  restore-keys: |
                      bun-${{ runner.os }}-

            - name: Install dependencies
              working-directory: web
              run: bun install --frozen-lockfile

            - name: Install Playwright browsers
              working-directory: web
              run: bunx playwright install --with-deps chromium

            - name: Test
              working-directory: web
              run: bun run test
