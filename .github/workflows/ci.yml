name: CI

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    api:
        name: API
        runs-on: ubuntu-latest
        timeout-minutes: 15

        steps:
            - name: Check out repository
              uses: actions/checkout@v4

            - name: Set up PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: "8.4"
                  extensions: bcmath, intl, mbstring, pcntl, pdo_sqlite, zip
                  tools: composer:v2
                  coverage: none
                  cache: composer
                  working-directory: api

            - name: Create environment file
              working-directory: api
              run: cp .env.example .env

            - name: Install dependencies
              working-directory: api
              run: composer install --prefer-dist --no-interaction --no-progress

            - name: Test
              working-directory: api
              run: composer test

    web:
        name: Web
        runs-on: ubuntu-latest
        timeout-minutes: 10

        steps:
            - name: Check out repository
              uses: actions/checkout@v4

            - name: Set up Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.x

            - name: Cache Bun
              uses: actions/cache@v4
              with:
                  path: ~/.bun/install/cache
                  key: bun-${{ runner.os }}-${{ hashFiles('web/bun.lock') }}
                  restore-keys: |
                      bun-${{ runner.os }}-

            - name: Install dependencies
              working-directory: web
              run: bun install --frozen-lockfile

            - name: Install Playwright browsers
              working-directory: web
              run: bunx playwright install --with-deps chromium

            - name: Test
              working-directory: web
              run: bun run test

            - name: Upload UI reference audit screenshots
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: ui-reference-audit
                  path: web/test-results/design-audit/
                  if-no-files-found: ignore
                  retention-days: 7
