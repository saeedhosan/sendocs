name: Build

on:
    workflow_dispatch:
    push:
        branches:
            - main
            
permissions:
    contents: read

concurrency:
    group: build-${{ github.ref }}
    cancel-in-progress: true

jobs:
    tests:
        name: Container tests
        runs-on: ubuntu-latest
        timeout-minutes: 30

        steps:
            - name: Check out repository
              uses: actions/checkout@v7

            - name: Create environment file
              run: cp -n .env.example .env

            - name: Run API tests
              run: docker compose run --rm api composer test

            - name: Run web tests
              run: docker compose run --rm web bun run test

    production-images:
        name: Production images
        needs: tests
        runs-on: ubuntu-latest
        timeout-minutes: 20

        steps:
            - name: Check out repository
              uses: actions/checkout@v7

            - name: Create environment file
              run: cp -n .env.example .env

            - name: Build production images
              env:
                  API_TARGET: prod
                  WEB_TARGET: prod
              run: docker compose build

    scalability-smoke:
        name: Scalability smoke (Docker Compose + k6)
        if: github.event_name == 'workflow_dispatch'
        runs-on: ubuntu-latest
        timeout-minutes: 25

        steps:
            - name: Check out repository
              uses: actions/checkout@v7

            - name: Record runner and commit
              run: |
                  mkdir -p scalability-results
                  {
                    echo "commit=${GITHUB_SHA}"
                    echo "runner_os=${RUNNER_OS}"
                    echo "runner_arch=${RUNNER_ARCH}"
                    echo "cpu_count=$(nproc)"
                    grep MemTotal /proc/meminfo
                    docker version
                    docker compose version
                  } > scalability-results/environment.txt

            - name: Create Compose environment
              run: cp .env.example .env

            - name: Build all Compose images
              run: docker compose build

            - name: Run migrations
              run: docker compose run --rm migrate

            - name: Start the complete Compose application stack
              # The test helper runs the full test suites, so exclude it from the load-test environment.
              run: docker compose up -d --scale test=0

            - name: Wait for API health
              run: |
                  for attempt in $(seq 1 60); do
                    if curl --fail --silent http://127.0.0.1:8000/health > /dev/null; then
                      exit 0
                    fi
                    sleep 2
                  done
                  docker compose ps
                  docker compose logs --no-color
                  exit 1

            - name: Wait for web frontend
              run: |
                  for attempt in $(seq 1 60); do
                    if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then
                      exit 0
                    fi
                    sleep 2
                  done
                  docker compose ps
                  docker compose logs --no-color web
                  exit 1

            - name: Run k6 owner and client journey smoke test
              run: |
                  docker run --rm --network host \
                    -v "${GITHUB_WORKSPACE}/tests/load:/scripts:ro" \
                    -v "${GITHUB_WORKSPACE}/scalability-results:/results" \
                    grafana/k6:0.57.0 run \
                    --summary-export=/results/k6-summary.json \
                    /scripts/smoke.js

            - name: Capture container state
              if: always()
              run: |
                  docker compose ps > scalability-results/compose-ps.txt || true
                  docker stats --no-stream > scalability-results/docker-stats.txt || true
                  docker compose logs --no-color > scalability-results/compose.log 2>&1 || true

            - name: Upload benchmark artifacts
              if: always()
              uses: actions/upload-artifact@v6
              with:
                  name: scalability-smoke-${{ github.run_id }}
                  path: scalability-results/
                  if-no-files-found: warn
                  retention-days: 14

            - name: Stop Compose services
              if: always()
              run: docker compose down --volumes --remove-orphans
