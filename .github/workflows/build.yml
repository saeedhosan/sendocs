name: Build

on:
    workflow_dispatch:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

permissions:
    contents: read

concurrency:
    group: build-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build:
        name: Build and verify
        runs-on: ubuntu-latest
        timeout-minutes: 45

        steps:
            - name: Check out repository
              uses: actions/checkout@v7

            - name: Create environment file
              run: cp -n .env.example .env

            - name: Run API tests
              run: docker compose run --rm --no-deps api composer test

            - name: Run web tests
              run: docker compose run --rm --no-deps web bun run test

            - name: Build production images
              env:
                  API_TARGET: prod
                  WEB_TARGET: prod
              run: docker compose build

            - name: Run migrations
              env:
                  API_TARGET: prod
                  WEB_TARGET: prod
              run: docker compose run --rm migrate

            - name: Start the application
              env:
                  API_TARGET: prod
                  WEB_TARGET: prod
              run: docker compose up -d --scale test=0 --scale migrate=0

            - name: Health check
              run: curl -fsS --retry 5 --retry-connrefused "http://127.0.0.1:3000/health"

            - name: Stop Compose services
              if: always()
              run: docker compose down --volumes --remove-orphans
