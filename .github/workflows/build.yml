name: Build

on:
    workflow_dispatch:
    push:
        branches:
            - main
            
permissions:
    contents: read

concurrency:
    group: build-${{ github.ref }}
    cancel-in-progress: true

jobs:
    tests:
        name: Container tests
        runs-on: ubuntu-latest
        timeout-minutes: 30

        steps:
            - name: Check out repository
              uses: actions/checkout@v4

            - name: Create environment file
              run: cp -n .env.example .env

            - name: Run API tests
              run: docker compose run --rm api composer test

            - name: Run web tests
              run: docker compose run --rm web bun run test

    production-images:
        name: Production images
        needs: tests
        runs-on: ubuntu-latest
        timeout-minutes: 20

        steps:
            - name: Check out repository
              uses: actions/checkout@v4

            - name: Create environment file
              run: cp -n .env.example .env

            - name: Build production images
              env:
                  API_TARGET: prod
                  WEB_TARGET: prod
              run: docker compose build
