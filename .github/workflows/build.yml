name: Build

on:
    workflow_dispatch:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

permissions:
    contents: read

concurrency:
    group: build-${{ github.ref }}
    cancel-in-progress: true

jobs:
    tests:
        name: Container tests
        runs-on: ubuntu-latest
        timeout-minutes: 30

        steps:
            - name: Check out repository
              uses: actions/checkout@v7

            - name: Create environment file
              run: cp -n .env.example .env

            - name: Run API tests
              run: docker compose run --rm api composer test

            - name: Run web tests
              run: docker compose run --rm web bun run test

    production-images:
        name: Production images
        # needs: tests
        runs-on: ubuntu-latest
        timeout-minutes: 20
        env:
            API_TARGET: prod
            WEB_TARGET: prod

        steps:
            - name: Check out repository
              uses: actions/checkout@v7

            - name: Create environment file
              run: cp -n .env.example .env

            - name: Build production images
              run: docker compose build

            - name: Run migrations
              run: docker compose run --rm migrate

            - name: Start the application
              run: docker compose up -d --scale test=0 --scale migrate=0

            - name: About the application
              run: docker compose exec api php artisan about

            - name: Health check
              run: curl -fsS --retry 10 --retry-all-errors --retry-delay 2 --retry-connrefused "http://127.0.0.1:3000/health"
