name: Build

on:
  push:
    branches:
      - main
    paths:
      - 'api/**'
      - 'web/**'
      - '.github/workflows/build.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'api/**'
      - 'web/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-images:
    name: Production images
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build API production image
        run: docker build --target prod -t sendocs-api-ci ./api

      - name: Build web production image
        run: docker build --target prod -t sendocs-web-ci ./web
