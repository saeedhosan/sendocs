name: Resolve Octane dependency

on:
    push:
        branches:
            - perf/separate-load-generator

permissions:
    contents: write

jobs:
    resolve:
        if: github.actor != 'github-actions[bot]'
        runs-on: ubuntu-latest
        steps:
            - name: Checkout PR branch
              uses: actions/checkout@v4
              with:
                  ref: perf/separate-load-generator
                  persist-credentials: true

            - name: Set up PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  tools: composer:v2
                  extensions: bcmath, intl, mbstring, pcntl, pdo_pgsql, zip

            - name: Require Laravel Octane
              working-directory: api
              run: composer require laravel/octane:^2.25 --no-interaction

            - name: Generate FrankenPHP Octane config
              working-directory: api
              run: php artisan octane:install --server=frankenphp --no-interaction

            - name: Commit Composer lock and generated config
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add api/composer.json api/composer.lock api/config/octane.php
                  if git diff --cached --quiet; then
                    echo "No dependency or config changes to commit."
                    exit 0
                  fi
                  git commit -m "build: add Laravel Octane with FrankenPHP"
                  git push origin HEAD:perf/separate-load-generator
