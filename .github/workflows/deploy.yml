name: Deploy production

on:
    push:
        tags:
            - "v*"

permissions:
    contents: read

concurrency:
    group: deploy-production
    cancel-in-progress: false

env:
    API_URL: ${{ secrets.API_URL }}
    WEB_URL: ${{ secrets.WEB_URL }}
    SSH_KEY: ${{ secrets.SSH_KEY }}
    SSH_HOST: ${{ secrets.SSH_HOST }}
    SSH_USER: ${{ secrets.SSH_USER }}
    SSH_PORT: ${{ secrets.SSH_PORT }}
    WEB_PATH: ${{ secrets.WEB_PATH }}
    API_PATH: ${{ secrets.API_PATH }}

jobs:
    verify:
        name: Verify release
        runs-on: ubuntu-latest
        timeout-minutes: 5

        steps:
            - name: Checkout tagged release
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0
                  ref: ${{ github.ref }}

            - name: Verify release is on main
              run: |
                  git fetch origin main --no-tags
                  git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
                    echo "::error::Production tags must point to a commit already merged into main."
                    exit 1
                  }

    api:
        name: API deployment
        needs: verify
        runs-on: ubuntu-latest
        timeout-minutes: 30
        environment: production

        steps:
            - name: Checkout tagged release
              uses: actions/checkout@v4
              with:
                  ref: ${{ github.ref }}

            - name: Set up PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: "8.4"
                  extensions: bcmath, intl, mbstring, pcntl, pdo_sqlite, zip
                  tools: composer:v2
                  coverage: none

            - name: Install dependencies
              working-directory: api
              run: composer install --no-dev --optimize-autoloader --no-interaction --no-progress

            - name: Deploy
              uses: appleboy/scp-action@v1.0.0
              with:
                  key: ${{ env.SSH_KEY }}
                  host: ${{ env.SSH_HOST }}
                  port: ${{ env.SSH_PORT }}
                  username: ${{ env.SSH_USER }}
                  source: api
                  target: ${{ env.API_PATH }}
                  strip_components: 1
                  overwrite: true

            - name: Run migrate
              uses: appleboy/ssh-action@v1.2.5
              env:
                  API_PATH: ${{ env.API_PATH }}
              with:
                  key: ${{ env.SSH_KEY }}
                  host: ${{ env.SSH_HOST }}
                  port: ${{ env.SSH_PORT }}
                  username: ${{ env.SSH_USER }}
                  envs: API_PATH
                  script: |
                      set -eu
                      cd "$API_PATH"
                      php artisan migrate --force
                      php artisan optimize:clear

            - name: Health check
              run: curl -fsS --retry 5 --retry-connrefused "${{ env.API_URL }}/health"

    web:
        name: Web deployment
        needs: api
        runs-on: ubuntu-latest
        timeout-minutes: 30
        environment: production

        steps:
            - name: Checkout tagged release
              uses: actions/checkout@v4
              with:
                  ref: ${{ github.ref }}

            - name: Set up Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.x

            - name: Install dependencies
              working-directory: web
              run: bun install --frozen-lockfile

            - name: Build assets
              working-directory: web
              env:
                  VITE_API_URL: ${{ secrets.API_URL }}
              run: bun run build

            - name: Deploy
              uses: appleboy/scp-action@v1.0.0
              with:
                  key: ${{ env.SSH_KEY }}
                  host: ${{ env.SSH_HOST }}
                  port: ${{ env.SSH_PORT }}
                  username: ${{ env.SSH_USER }}
                  source: web/dist
                  target: ${{ env.WEB_PATH }}
                  strip_components: 2
                  overwrite: true

            - name: Health check
              run: curl -fsS --retry 5 --retry-connrefused "${{ env.WEB_URL }}"
