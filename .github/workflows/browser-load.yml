name: Browser Journey Benchmark

on:
    workflow_dispatch:
    pull_request:
        branches:
            - main
        paths-ignore:
            - docs/benchmark.md

permissions:
    contents: write

concurrency:
    group: browser-benchmark-${{ github.head_ref || github.ref }}
    cancel-in-progress: true

jobs:
    browser_test:
        name: Compose + k6 Chromium journeys
        runs-on: ubuntu-latest
        timeout-minutes: 30

        steps:
            - name: Check out repository
              uses: actions/checkout@v7
              with:
                  ref: ${{ github.head_ref || github.ref_name }}
                  persist-credentials: true

            - name: Record runner resources
              id: runner
              run: |
                  mkdir -p scalability-results
                  echo "cpu_count=$(nproc)" >> "$GITHUB_OUTPUT"
                  awk '/MemTotal/ {printf "memory_gb=%.1f\\n", $2/1024/1024}' /proc/meminfo >> "$GITHUB_OUTPUT"

            - name: Create Compose environment
              run: cp .env.example .env

            - name: Build Compose images
              run: docker compose build

            - name: Run migrations
              run: docker compose run --rm migrate

            - name: Start the complete Compose application stack
              run: docker compose up -d --scale test=0 --scale migrate=0

            - name: Wait for frontend and API health
              run: |
                  for attempt in $(seq 1 60); do
                    if curl --fail --silent http://127.0.0.1:3000/health > /dev/null; then
                      exit 0
                    fi
                    sleep 2
                  done
                  docker compose ps
                  docker compose logs --no-color
                  exit 1

            - name: Seed two isolated login accounts
              run: docker compose exec -T api php tests/Load/seed-owners.php 2 > scalability-results/owners.json

            - name: Set up k6 and Chromium
              uses: grafana/setup-k6-action@v1
              with:
                  k6-version: '0.57.0'
                  browser: true

            - name: Run real-browser user journeys
              env:
                  BASE_URL: http://127.0.0.1:3000
                  GITHUB_RUN_ID: ${{ github.run_id }}
                  RUNNER_CPU_COUNT: ${{ steps.runner.outputs.cpu_count }}
                  RUNNER_MEMORY_GB: ${{ steps.runner.outputs.memory_gb }}
              run: |
                  k6 run --summary-export=./scalability-results/browser-summary.json ./tests/browser/browser-journey.js

            - name: Remove temporary synthetic credentials
              if: always()
              run: rm -f scalability-results/owners.json

            - name: Append browser result to benchmark history
              if: always() && hashFiles('scalability-results/browser-benchmark-entry.md') != ''
              run: |
                  marker="$(head -n 1 scalability-results/browser-benchmark-entry.md)"
                  if ! grep --fixed-strings --line-regexp --quiet "$marker" docs/benchmark.md; then
                    printf '\n' >> docs/benchmark.md
                    cat scalability-results/browser-benchmark-entry.md >> docs/benchmark.md
                  fi

            - name: Commit browser benchmark result
              if: always() && hashFiles('scalability-results/browser-benchmark-entry.md') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
              uses: stefanzweifel/git-auto-commit-action@v7
              with:
                  branch: ${{ github.head_ref || github.ref_name }}
                  file_pattern: docs/benchmark.md
                  commit_message: "docs: record browser benchmark result"

            - name: Capture application logs on failure
              if: failure()
              run: docker compose logs --no-color > scalability-results/compose-failure.log 2>&1 || true

            - name: Upload browser benchmark artifacts
              if: always()
              uses: actions/upload-artifact@v6
              with:
                  name: browser-benchmark-${{ github.run_id }}
                  path: |
                      scalability-results/browser-benchmark-entry.md
                      scalability-results/browser-summary.json
                      scalability-results/compose-failure.log
                  if-no-files-found: warn
                  retention-days: 14

            - name: Stop Compose services
              if: always()
              run: docker compose down --volumes --remove-orphans
