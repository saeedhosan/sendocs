name: Generate Octane dependencies

on:
    workflow_dispatch:
        inputs:
            target_branch:
                description: "PR branch to update"
                required: true
                type: string
                default: "perf/separate-load-generator"

permissions:
    contents: write

jobs:
    generate:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - name: Check out target branch
              uses: actions/checkout@v7
              with:
                  ref: ${{ inputs.target_branch }}
                  persist-credentials: true

            - name: Set up PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: "8.4"
                  extensions: bcmath, intl, mbstring, pcntl, pdo_pgsql, zip
                  tools: composer:v2
                  coverage: none
                  working-directory: api

            - name: Install Octane and generate configuration
              working-directory: api
              run: |
                  composer require laravel/octane:^2.25 --no-interaction --no-progress
                  php artisan octane:install --server=frankenphp
                  rm -f frankenphp

            - name: Validate Composer files
              working-directory: api
              run: |
                  composer validate --strict
                  composer install --no-interaction --no-progress --dry-run

            - name: Commit generated dependency files
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add api/composer.json api/composer.lock api/config/octane.php
                  git diff --cached --quiet && exit 0
                  git commit -m "build: add Laravel Octane FrankenPHP dependencies"
                  git push origin HEAD:"${{ inputs.target_branch }}"
