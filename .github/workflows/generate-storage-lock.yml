name: Generate S3 dependency lock

on:
    push:
        branches:
            - feat/rustfs-local-object-storage

permissions:
    contents: read

jobs:
    composer-lock:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  tools: composer:v2
                  coverage: none
            - name: Resolve S3 adapter and lock dependencies
              working-directory: api
              run: composer update league/flysystem-aws-s3-v3 --with-all-dependencies --no-interaction --prefer-dist --no-scripts
            - uses: actions/upload-artifact@v4
              with:
                  name: composer-lock
                  path: api/composer.lock
                  retention-days: 1
