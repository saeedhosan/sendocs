name: Generate S3 dependency lock

on:
    push:
        branches:
            - feat/rustfs-local-object-storage

permissions:
    contents: write

jobs:
    composer-lock:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  tools: composer:v2
                  coverage: none
            - name: Resolve S3 adapter and lock dependencies
              working-directory: api
              run: composer update league/flysystem-aws-s3-v3 --with-all-dependencies --no-interaction --prefer-dist --no-scripts
            - name: Commit the generated lockfile
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add api/composer.lock
                  if ! git diff --cached --quiet; then
                      git commit -m "build: lock S3 storage dependencies"
                      git push
                  fi
